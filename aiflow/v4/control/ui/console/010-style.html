<style>
:root{
  --bg:#121110; --surface:#1a1917; --surface-2:#201e1b; --line:#2d2a26; --line-soft:#26231f;
  --fg:#ece7df; --muted:#9a9388; --faint:#6b655c;
  --accent:#d1a276; --accent-weak:rgba(209,162,118,.16); --accent-fg:#171512;
  --good:#86c77f; --good-weak:rgba(134,199,127,.14);
  --warn:#e6bb52; --warn-weak:rgba(230,187,82,.15);
  --crit:#e46e5e; --crit-weak:rgba(228,110,94,.15);
  --track:#302c27; --overlay:rgba(0,0,0,.62); --shadow:0 20px 60px rgba(0,0,0,.55);
  --provider-claude:#d98b5f; --provider-codex:#58c4a3; --provider-grok:#b69df2; --provider-opencode:#8fa3b5;
  --f-ui:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-cond:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f5f1eb; --surface:#fffdf9; --surface-2:#f7f3ed; --line:#ded6cb; --line-soft:#eee7dd;
  --fg:#292620; --muted:#6d665d; --faint:#9a9185;
  --accent:#8c5a3b; --accent-weak:rgba(140,90,59,.13); --accent-fg:#fffdf9;
  --good:#467953; --good-weak:rgba(70,121,83,.13);
  --warn:#9a6718; --warn-weak:rgba(154,103,24,.14);
  --crit:#ad493d; --crit-weak:rgba(173,73,61,.13);
  --track:#e7dfd4; --overlay:rgba(41,38,32,.42); --shadow:0 18px 50px rgba(41,38,32,.18);
  --provider-codex:#58a98b; --provider-grok:#9c83d4; --provider-opencode:#74899a;
  color-scheme:light;
}
*{box-sizing:border-box}
html{overflow-x:hidden}
html.role-loading .tabs,html.role-loading #view-as-switch,html.role-loading main{visibility:hidden}
body{margin:0; min-height:100vh; display:flex; flex-direction:column; overflow-x:hidden; background:var(--bg); color:var(--fg); font-family:var(--f-ui); font-size:14px; line-height:1.45}
body > main{flex:1 0 auto; width:100%}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--surface)}
button,input,select,textarea{font:inherit; color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
.mono{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
/* full window width: 16 px gutter, 24 px on screens wider than 1400 px */
.wrap{width:100%; max-width:none; margin:0; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}
@media (min-width:1401px){ .wrap{padding-left:max(24px, env(safe-area-inset-left,0px)); padding-right:max(24px, env(safe-area-inset-right,0px))} }

/* top bar */
.topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--surface); border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex; flex-wrap:wrap; align-items:center; gap:10px 18px; padding-block:10px}
.brand{display:flex; align-items:center; gap:10px; font-family:var(--f-cond); font-weight:700; font-size:18px; letter-spacing:.01em}
.brand svg{color:var(--accent)}
.tabs{display:flex; min-width:0; max-width:100%; gap:4px; overflow-x:auto; overflow-y:hidden; overscroll-behavior-x:contain; scrollbar-width:thin; -webkit-overflow-scrolling:touch; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:3px}
.tab{flex:0 0 auto; white-space:nowrap; border:0; background:transparent; padding:8px 14px; border-radius:8px; cursor:pointer; color:var(--muted); font-weight:500; min-height:38px}
.tab[aria-selected="true"]{background:var(--surface); color:var(--fg); box-shadow:0 1px 2px rgba(0,0,0,.08), inset 0 0 0 1px var(--line)}
.tab-divider{align-self:center;width:1px;height:20px;background:var(--line);margin-inline:5px;flex:none}
.spacer{flex:1 1 auto}
.sim{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.sim .clock{font-family:var(--f-mono); font-size:15px; padding:6px 10px; border:1px solid var(--line); border-radius:8px; background:var(--surface-2); min-width:92px; text-align:center}
.iconbtn{display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:38px; min-width:38px; padding:0 10px; border-radius:8px; border:1px solid var(--line); background:var(--surface); cursor:pointer; color:var(--fg); transition:background .15s, border-color .15s, transform .1s}
.iconbtn:hover{background:var(--surface-2); border-color:var(--faint)}
.iconbtn:active{transform:scale(.97)}
.iconbtn[aria-pressed="true"]{background:var(--accent-weak); border-color:var(--accent); color:var(--accent)}
.badge-sample{font-size:12px; padding:4px 10px; border-radius:999px; border:1px dashed var(--faint); color:var(--muted)}

main{padding-block:20px 48px; display:flex; flex-direction:column; gap:16px}
.view{display:flex; flex-direction:column; gap:16px}
.view[hidden]{display:none}

/* summary strip */
.kpis{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:10px}
.kpi{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px; display:flex; flex-direction:column; gap:2px; text-align:left; cursor:pointer; transition:border-color .15s, transform .15s}
.kpi:hover{border-color:var(--accent); transform:translateY(-1px)}
.kpi .k-label{font-family:var(--f-cond); font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:600}
.kpi .k-value{font-family:var(--f-cond); font-size:28px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.1}
.kpi .k-sub{font-size:12px; color:var(--muted)}
.kpi[data-tone="warn"] .k-value{color:var(--warn)}
.kpi[data-tone="crit"] .k-value{color:var(--crit)}

/* panels */
.panel{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:12px; min-width:0}
.review-list{display:grid; gap:14px}
.review-card{gap:14px}
.review-title{display:flex; align-items:flex-start; gap:10px; flex-wrap:wrap}
.review-title h2{margin:0; font-family:var(--f-cond); font-size:19px}
.review-content{white-space:pre-wrap; overflow-wrap:anywhere; color:var(--muted); max-height:280px; overflow:auto}
.review-facts{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px}
.review-fact{background:var(--surface-2); border:1px solid var(--line-soft); border-radius:9px; padding:9px 10px; min-width:0}
.review-fact .label{color:var(--muted); font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em}
.review-fact .value{margin-top:3px; overflow-wrap:anywhere}
.review-actions{display:flex; gap:8px; flex-wrap:wrap; align-items:flex-start}
.review-actions textarea{flex:1 1 320px; min-height:72px; resize:vertical; border:1px solid var(--line); border-radius:8px; padding:9px 10px; background:var(--surface-2)}
.review-auth{display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-weight:500}
.review-auth input{width:min(360px,100%); min-height:38px; border:1px solid var(--line); border-radius:8px; padding:7px 10px; background:var(--surface-2)}
.review-filters{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.review-filters label{display:flex; align-items:center; gap:8px; font-weight:500}
.review-filters select{min-height:36px; border:1px solid var(--line); border-radius:8px; padding:6px 10px; background:var(--surface-2)}
.review-kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px}
.review-kpi{border:1px solid var(--line-soft); border-radius:9px; padding:10px 12px; background:var(--surface-2)}
.review-kpi .label{color:var(--muted); font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em}
.review-kpi strong{display:block; margin-top:4px; font:700 22px var(--f-cond); font-variant-numeric:tabular-nums}
.review-chart{display:grid; gap:6px}
.review-chart-row{display:grid; grid-template-columns:92px minmax(0,1fr) 28px; align-items:center; gap:8px; font-size:12px}
.review-chart-bar{height:22px; display:flex; align-items:stretch; background:var(--surface-2); border-radius:5px; overflow:hidden; min-width:0}
.review-chart-bar span{display:flex; justify-content:center; align-items:center; min-width:0; color:#fff; font-size:11px; font-weight:600; overflow:hidden}
.reason-question_from_ai{background:var(--provider-claude)}.reason-decision_needed{background:#7B61A8}.reason-review_before_merge{background:#0F7548}.reason-blocked{background:#B66A00}
.review-legend{display:flex; gap:8px 16px; flex-wrap:wrap; font-size:12px; color:var(--muted)}
.review-legend span{display:inline-flex; align-items:center; gap:6px}.review-legend i{display:inline-block; width:10px; height:10px; border-radius:2px}
.review-breakdown{display:grid; grid-template-columns:minmax(0,1.7fr) minmax(260px,1fr); gap:16px; align-items:start}
.review-breakdown > div{min-width:0}
.review-suggestions table{width:100%; border-collapse:collapse; text-align:left}
.review-suggestions th,.review-suggestions td{padding:7px 8px; border-bottom:1px solid var(--line-soft); vertical-align:top}
.review-thread{border-left:3px solid var(--accent); padding-left:12px; display:grid; gap:8px}
.review-thread-line{padding:8px 10px; background:var(--surface-2); border-radius:8px; overflow-wrap:anywhere}
.review-thread-line .muted{font-size:11px}
@media(max-width:900px){.review-breakdown{grid-template-columns:minmax(0,1fr)}}
.panel-h{display:flex; align-items:center; gap:10px 12px; flex-wrap:wrap}
.panel-h h2{margin:0; font-family:var(--f-cond); font-size:17px; font-weight:600; letter-spacing:.01em; text-wrap:balance}
.firstuse{display:flex; gap:12px; align-items:center; justify-content:space-between; margin:12px 0; padding:10px 14px; border:1px solid var(--accent); background:var(--accent-weak); border-radius:9px}
.panel-h .hint{color:var(--muted); font-size:13px}
.grid-2{display:grid; grid-template-columns:minmax(0,1.7fr) minmax(0,1fr); gap:16px; align-items:start}
.stack{display:flex; flex-direction:column; gap:16px; min-width:0}
.backup-form{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
.backup-form label,.panel > label{display:flex; flex-direction:column; gap:5px; color:var(--muted); font-size:12px; font-weight:600}
.backup-form .wide,.backup-help{grid-column:1/-1}
.backup-form input,.backup-form select,.panel > label select{width:100%; min-height:40px; padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:var(--surface-2)}
.backup-help{color:var(--muted); font-size:12px}
.backup-command{width:100%; min-height:132px; resize:vertical; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--surface-2); font:12px/1.45 var(--f-mono); overflow-wrap:anywhere}
.backup-outcomes{display:grid; gap:8px}
.backup-outcomes>div{display:grid; grid-template-columns:minmax(140px,1fr) auto; gap:5px 10px; align-items:center}
.backup-outcomes .small{grid-column:1/-1}
@media (max-width:640px){.backup-form{grid-template-columns:minmax(0,1fr)}}
@media (max-width:1000px){ .grid-2{grid-template-columns:minmax(0,1fr)} }

/* chips and pills */
.pill{display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:600; white-space:nowrap; background:var(--surface-2); color:var(--muted); border:1px solid var(--line)}
.pill[data-tone="ok"]{background:var(--good-weak); color:var(--good); border-color:transparent}
.pill[data-tone="warn"]{background:var(--warn-weak); color:var(--warn); border-color:transparent}
.pill[data-tone="crit"]{background:var(--crit-weak); color:var(--crit); border-color:transparent}
.pill[data-tone="info"]{background:var(--accent-weak); color:var(--accent); border-color:transparent}
.pill .dot{width:7px; height:7px; border-radius:999px; background:currentColor}
.pill[data-pulse] .dot{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1; transform:scale(1)}50%{opacity:.35; transform:scale(.7)}}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:40px; padding:0 14px; border-radius:9px; border:1px solid var(--line); background:var(--surface); cursor:pointer; font-weight:500; transition:background .15s, border-color .15s, transform .1s}
.btn:hover{background:var(--surface-2); border-color:var(--faint)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent); color:var(--accent-fg); border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--crit); border-color:var(--crit)}
.btn[disabled]{opacity:.55; cursor:not-allowed}
.btn.sm{min-height:34px; padding:0 10px; font-size:13px}
.seg{display:flex; gap:6px; flex-wrap:wrap}
.seg button{min-height:34px; padding:0 12px; border-radius:999px; border:1px solid var(--line); background:transparent; cursor:pointer; color:var(--muted); font-size:13px; font-weight:500}
.seg button[aria-pressed="true"]{background:var(--fg); color:var(--bg); border-color:var(--fg)}

/* bars */
.track{position:relative; height:8px; border-radius:999px; background:var(--track); overflow:hidden; min-width:40px}
.track i{position:absolute; inset:0 auto 0 0; border-radius:999px; background:var(--accent); transition:width .9s cubic-bezier(.2,.7,.2,1), background .3s}
.track i[data-tone="warn"]{background:var(--warn)}
.track i[data-tone="crit"]{background:var(--crit)}
.track b{position:absolute; top:-2px; bottom:-2px; width:1px; background:var(--faint); opacity:.8}
.meter{display:grid; grid-template-columns:40px minmax(0,1fr) auto; gap:10px; align-items:center; font-size:12px}
.meter .m-label{color:var(--muted)}
.meter .m-val{font-family:var(--f-mono); min-width:86px; text-align:right}

/* alerts */
.alerts{display:flex; flex-direction:column; gap:8px}
.alert{display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 14px; animation:slideIn .45s ease both}
.alert .a-title{font-weight:600}
.alert .a-detail{color:var(--muted); font-size:13px}
.license-warning{margin:14px 0;padding:12px 16px;border:1px solid var(--warn);border-radius:10px;background:var(--surface);color:var(--fg);font-weight:600}
.license-warning[data-tone="crit"]{border-color:var(--crit)}
@keyframes slideIn{from{opacity:0; transform:translateY(-6px)}to{opacity:1; transform:none}}

/* nodes */
.nodes{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:12px}
.node{text-align:left; border:1px solid var(--line); border-radius:12px; padding:14px; background:var(--surface-2); display:flex; flex-direction:column; gap:10px; cursor:pointer; transition:border-color .15s, box-shadow .2s, transform .15s; width:100%}
.node:hover{border-color:var(--accent); box-shadow:0 6px 18px rgba(16,24,40,.10); transform:translateY(-1px)}
.node-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.node-top .n-name{font-family:var(--f-cond); font-weight:700; font-size:17px}
.slots{display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:12px; color:var(--muted)}
.slot{width:16px; height:16px; border-radius:4px; border:1px solid var(--faint); transition:background .4s, border-color .4s}
.slot[data-used]{background:var(--accent); border-color:var(--accent)}
.node-accs{display:flex; flex-direction:column; gap:5px; border-top:1px solid var(--line-soft); padding-top:9px}
.node-acc{display:flex; align-items:center; gap:8px; font-size:12px; min-width:0}
.node-acc .who{font-family:var(--f-mono)}
.node-acc .what{color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.sdot{width:8px; height:8px; border-radius:999px; background:var(--faint); flex:none}
.sdot[data-tone="ok"]{background:var(--good)} .sdot[data-tone="warn"]{background:var(--warn)} .sdot[data-tone="crit"]{background:var(--crit)} .sdot[data-tone="info"]{background:var(--accent)}

/* feed */
.feed{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; max-height:470px; overflow:auto; scrollbar-width:thin}
.feed li{display:grid; grid-template-columns:62px 118px minmax(0,1fr); gap:8px; align-items:baseline; padding:7px 2px; border-bottom:1px solid var(--line-soft); font-size:12.5px}
.feed li.enter{animation:feedIn .6s cubic-bezier(.2,.7,.2,1) both}
.feed li.enter .f-text{animation:flash 1.6s ease both}
@keyframes feedIn{from{opacity:0; transform:translateY(-8px)}to{opacity:1; transform:none}}
@keyframes flash{from{background:var(--accent-weak)}to{background:transparent}}
.feed .f-time{font-family:var(--f-mono); color:var(--muted)}
.feed .f-type{font-family:var(--f-mono); font-size:11px; padding:1px 6px; border-radius:6px; background:var(--surface-2); border:1px solid var(--line); justify-self:start; color:var(--muted)}
.feed .f-type[data-tone="ok"]{color:var(--good)} .feed .f-type[data-tone="warn"]{color:var(--warn)} .feed .f-type[data-tone="crit"]{color:var(--crit)} .feed .f-type[data-tone="info"]{color:var(--accent)}
.feed .f-text{min-width:0; overflow-wrap:anywhere; border-radius:4px}

/* tables */
.tablebox{overflow-x:auto}
table{width:100%; border-collapse:collapse; min-width:860px}
th{font-family:var(--f-cond); font-weight:600; font-size:12px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); text-align:left; padding:8px 10px; border-bottom:1px solid var(--line)}
td{padding:10px; border-bottom:1px solid var(--line-soft); vertical-align:middle}
tbody tr{cursor:pointer; transition:background .15s}
tbody tr:hover{background:var(--surface-2)}
tbody tr:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}

/* services */
.svc{display:grid; grid-template-columns:10px minmax(0,1fr) auto auto; gap:10px; align-items:center; padding:7px 4px; border-bottom:1px solid var(--line-soft); font-size:12.5px; background:none; border-left:0; border-right:0; border-top:0; width:100%; text-align:left; cursor:pointer; border-radius:6px}
.svc:hover{background:var(--surface-2)}
.svc .s-group{color:var(--muted)}
.svc .s-mem{font-family:var(--f-mono); min-width:62px; text-align:right}

/* incidents and rollout */
.inc{border:1px solid var(--line); border-radius:10px; padding:11px 13px; display:flex; flex-direction:column; gap:5px; background:var(--surface-2); text-align:left; cursor:pointer; width:100%; transition:border-color .15s}
.inc:hover{border-color:var(--accent)}
.inc-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.roll{display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--line-soft); flex-wrap:wrap; font-size:13px}

/* delivery */
.dhead{display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap}
.projtabs{display:flex; gap:6px; flex-wrap:wrap}
.projtab{min-height:40px; padding:0 14px; border-radius:10px; border:1px solid var(--line); background:var(--surface); cursor:pointer; display:flex; align-items:center; gap:8px; font-weight:600}
.projtab[aria-pressed="true"]{border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent)}
.projtab .sub{font-weight:400; font-size:12px; color:var(--muted)}
.search{display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:10px; padding:0 10px; background:var(--surface); min-height:40px; flex:1 1 220px; max-width:360px}
.search input{border:0; outline:0; background:transparent; min-width:0; flex:1; min-height:38px}
.search:focus-within{border-color:var(--accent)}
.board{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(232px,1fr); gap:10px; overflow-x:auto; padding-bottom:6px; scrollbar-width:thin}
.col{background:var(--surface-2); border:1px solid var(--line-soft); border-radius:12px; padding:10px; display:flex; flex-direction:column; gap:8px; min-height:160px}
.col-h{display:flex; align-items:center; justify-content:space-between; font-family:var(--f-cond); font-weight:600; font-size:13px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted)}
.col-h .count{font-family:var(--f-mono); font-size:12px; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:0 8px; color:var(--fg)}
.col-empty{font-size:12px; color:var(--faint); text-align:center; padding:14px 0}
.card{display:flex; flex-direction:column; gap:7px; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 11px; cursor:pointer; width:100%; transition:border-color .15s, box-shadow .2s, transform .15s}
.card:hover{border-color:var(--accent); box-shadow:0 6px 18px rgba(16,24,40,.10); transform:translateY(-1px)}
.card-wrap{display:flex;flex-direction:column;gap:3px}
.card-pr-link{align-self:flex-start;padding:2px 8px;font-size:12px;color:var(--accent);text-decoration:underline}
.card .c-top{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.card .c-key{font-family:var(--f-mono); font-size:12px; color:var(--muted)}
.card .c-type{font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:5px; padding:0 5px}
.card .c-title{font-weight:500; font-size:13.5px; line-height:1.35}
.card .c-run{font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; flex-wrap:wrap}
