name: Release v4

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  v4-tests:
    name: Test v4 before release
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:8.2.10-bookworm
        ports: ["6379:6379"]
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_USER: aiflow
          POSTGRES_PASSWORD: test
          POSTGRES_DB: aiflow4
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aiflow -d aiflow4"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install
        run: pip install uv==0.13.4 && uv sync --frozen --group dev
      - name: Run v4 tests
        env:
          AIFLOW4_TEST_REDIS_URL: redis://localhost:6379/5
          AIFLOW4_TEST_DATABASE_URL: postgresql://aiflow:test@localhost:5432/aiflow4
        run: uv run --frozen pytest tests/v4 -q

  # The clean-install acceptance test (docs/v4/clean-install-acceptance.md) gates the release: a failure stops the
  # publication and release-bug opens a bug ticket.
  acceptance:
    name: Clean-install acceptance (full) before release
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      redis:
        image: redis:8.2.10-bookworm
        ports: ["6379:6379"]
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_USER: aiflow
          POSTGRES_PASSWORD: test
          POSTGRES_DB: aiflow4
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aiflow -d aiflow4"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install
        run: pip install uv==0.13.4 && uv sync --frozen --group dev
      - name: Two newest published releases for clean install, upgrade and rollback
        id: releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAGS=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json isDraft,isPrerelease,tagName \
            --jq '[.[] | select(.isDraft == false and .isPrerelease == false) | .tagName] | .[:2] | reverse | .[]' || true)
          echo "previous=$(echo "$TAGS" | sed -n 1p)" >> "$GITHUB_OUTPUT"
          echo "target=$(echo "$TAGS" | sed -n 2p)" >> "$GITHUB_OUTPUT"
      - name: Acceptance test (full)
        env:
          AIFLOW4_TEST_REDIS_URL: redis://localhost:6379/5
          AIFLOW4_TEST_DATABASE_URL: postgresql://aiflow:test@localhost:5432/aiflow4
          ACCEPTANCE_PREVIOUS: ${{ steps.releases.outputs.previous }}
          ACCEPTANCE_TARGET: ${{ steps.releases.outputs.target }}
        run: bash deploy/v4/ci/clean-install-acceptance.sh full

      - name: Upload release acceptance logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clean-install-acceptance-release
          path: ${{ runner.temp }}/aiflow-acceptance-logs/
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Package, sign and publish v4 release
    needs: [v4-tests, acceptance]
    if: github.repository == 'jooservices/ai-flow'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      redis:
        image: redis:8.2.10-bookworm
        ports: ["6379:6379"]
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_USER: aiflow
          POSTGRES_PASSWORD: test
          POSTGRES_DB: aiflow4
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aiflow -d aiflow4"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
        with:
          cosign-release: v3.0.6

      - name: Validate tag and master ancestry
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git fetch origin master --tags
          test "$(git rev-parse "$VERSION^{commit}")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "revision=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          PUBLISHED_RELEASES=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 \
            --json isDraft,isPrerelease,publishedAt,tagName \
            --jq '[.[] | select(.isDraft == false and .isPrerelease == false)] | sort_by(.publishedAt) | reverse | .[].tagName')
          RELEASE_BASE=$(git rev-parse "$GITHUB_SHA^")
          PREVIOUS=""
          while IFS= read -r candidate; do
            [[ "$candidate" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || continue
            candidate_commit=$(git rev-parse --verify "$candidate^{commit}" 2>/dev/null || true)
            [[ -n "$candidate_commit" ]] || continue
            if git merge-base --is-ancestor "$candidate_commit" "$RELEASE_BASE"; then
              PREVIOUS=$candidate
              break
            fi
          done <<< "$PUBLISHED_RELEASES"
          echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"

      - name: Download previous published release for upgrade and rollback
        if: steps.release.outputs.previous != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ steps.release.outputs.previous }}
        run: |
          mkdir -p "$RUNNER_TEMP/aiflow4-previous"
          gh release download "$PREVIOUS" --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/aiflow4-previous" \
            --pattern "aiflow4-$PREVIOUS.tar.gz" \
            --pattern "aiflow4-$PREVIOUS.tar.gz.sigstore.json"

      - name: Build tarball and conventional changelog
        env:
          VERSION: ${{ steps.release.outputs.version }}
          PREVIOUS: ${{ steps.release.outputs.previous }}
        run: |
          mkdir -p dist
          git archive --format=tar.gz --output="dist/aiflow4-$VERSION.tar.gz" "$VERSION" \
            aiflow pyproject.toml uv.lock prompts deploy
          # the tarball also carries the documentation site (docs-site/) built from docs/guide and the API code
          pip install uv==0.13.4 && uv sync --frozen
          PYTHON="uv run --frozen python" bash deploy/v4/ci/add-docs-site.sh "$VERSION" "dist/aiflow4-$VERSION.tar.gz"
          python3 -m aiflow.v4.core.release_notes "$VERSION" --previous "$PREVIOUS" > dist/CHANGELOG.md
          (cd dist && sha256sum "aiflow4-$VERSION.tar.gz" > SHA256SUMS)

      - name: Sign release tarball with GitHub OIDC
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          cosign sign-blob --yes \
            --bundle "dist/aiflow4-$VERSION.tar.gz.sigstore.json" \
            "dist/aiflow4-$VERSION.tar.gz"

      # The signed, unpublished candidate is staged into the documented installer flow. Console sign-in is on,
      # anonymous callers are refused, the Super Administrator signs in, and both machines use the documented join.
      - name: Clean-install signed candidate on Ubuntu control and two nodes
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/aiflow-candidate-logs"
          bash deploy/v4/ci/clean-install-containers.sh "$VERSION" \
            "dist/aiflow4-$VERSION.tar.gz" "dist/aiflow4-$VERSION.tar.gz.sigstore.json" dist/SHA256SUMS \
            2>&1 | tee "$RUNNER_TEMP/aiflow-candidate-logs/candidate-clean-install.log"

      # The documented clean install above is the acceptance gate. This focused smoke additionally exercises the
      # canary wave and failed-node rollback paths with the same signed candidate.
      - name: Fleet rollout and rollback smoke using signed candidate artifacts
        env:
          VERSION: ${{ steps.release.outputs.version }}
          PREVIOUS: ${{ steps.release.outputs.previous }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/aiflow-candidate-logs"
          {
            if [ -n "$PREVIOUS" ] \
              && [ -f "$RUNNER_TEMP/aiflow4-previous/aiflow4-$PREVIOUS.tar.gz" ] \
              && [ -f "$RUNNER_TEMP/aiflow4-previous/aiflow4-$PREVIOUS.tar.gz.sigstore.json" ]; then
              bash deploy/v4/ci/install-smoke.sh "$VERSION" \
                "dist/aiflow4-$VERSION.tar.gz" "dist/aiflow4-$VERSION.tar.gz.sigstore.json" \
                "$PREVIOUS" "$RUNNER_TEMP/aiflow4-previous/aiflow4-$PREVIOUS.tar.gz" \
                "$RUNNER_TEMP/aiflow4-previous/aiflow4-$PREVIOUS.tar.gz.sigstore.json"
            else
              bash deploy/v4/ci/install-smoke.sh "$VERSION" \
                "dist/aiflow4-$VERSION.tar.gz" "dist/aiflow4-$VERSION.tar.gz.sigstore.json"
            fi
          } 2>&1 | tee "$RUNNER_TEMP/aiflow-candidate-logs/fleet-rollout-smoke.log"

      - name: Upload candidate install and fleet smoke logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clean-install-candidate-release
          path: ${{ runner.temp }}/aiflow-candidate-logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build and push control-api image to GHCR
        env:
          VERSION: ${{ steps.release.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          IMAGE="ghcr.io/jooservices/ai-flow/control-api:$VERSION"
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build \
            --build-arg "AIFLOW4_VERSION=$VERSION" \
            --build-arg "AIFLOW4_REVISION=$GITHUB_SHA" \
            -f deploy/v4/control/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Sign control-api image with GitHub OIDC
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          cosign sign --yes "$IMAGE"

      - name: Create GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --title "AI Flow $VERSION" --notes-file dist/CHANGELOG.md
          else
            gh release create "$VERSION" --target "$GITHUB_SHA" --title "AI Flow $VERSION" \
              --notes-file dist/CHANGELOG.md
          fi
          gh release upload "$VERSION" \
            "dist/aiflow4-$VERSION.tar.gz" \
            "dist/aiflow4-$VERSION.tar.gz.sigstore.json" \
            dist/SHA256SUMS --clobber

  release-bug:
    name: Open a bug ticket for the failed release
    needs: [v4-tests, acceptance, release]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download release acceptance logs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: clean-install-acceptance-release
          path: ${{ runner.temp }}/aiflow-acceptance-logs
      - name: Download candidate install logs
        continue-on-error: true  # absent when the release job never started
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: clean-install-candidate-release
          path: ${{ runner.temp }}/aiflow-acceptance-logs
      - name: Open the bug ticket
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE_LOG_DIR: ${{ runner.temp }}/aiflow-acceptance-logs
        run: bash deploy/v4/ci/open-bug-ticket.sh "Release ${GITHUB_REF_NAME} blocked by a failed clean-install acceptance test or install smoke"
