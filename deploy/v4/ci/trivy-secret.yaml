# Only these test files hold fake keys and tokens on purpose (they prove secrets are redacted or encrypted).
# Everything else under tests/ is scanned like the rest of the repository: add a file here only after a reviewer
# has confirmed that every finding in it is fake.
allow-rules:
  - id: test-fixtures
    description: fake credentials used by tests
    path: '^tests/(test_memory\.py|v4/(test_knowledge_learning|test_github_connect|test_security)\.py)$'
