# AI Flow v4 control-plane services: registry (PostgreSQL + pgvector), Redis, Traefik, OpenObserve, Gatus and
# Mailpit. `aiflow4 install control` copies this file, gatus.yaml and ../o2/lab.env to /srv/aiflow/control/infra/
# and runs `docker compose up -d`; it creates the networks that compose.yaml (the AI Flow processes) joins.
# Images are pinned; data lives in /srv/aiflow/control/data and survives upgrades, rollbacks and reinstalls.
# Passwords come from root-only env files written at install time (docs/v4/control-install.md), never from here.
name: aiflow4-infra

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    container_name: aiflow4-postgres
    restart: unless-stopped
    env_file: [/etc/aiflow/secrets/control/postgres.env]
    volumes:
      - /srv/aiflow/control/data/postgres:/var/lib/postgresql/data
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""], interval: 5s, timeout: 5s, retries: 10, start_period: 10s }
    mem_limit: 2g
    networks: [control]

  redis:
    image: redis:7.4-alpine
    container_name: aiflow4-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - /srv/aiflow/control/data/redis:/data
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 5s, retries: 10 }
    mem_limit: 512m
    networks: [control]

  traefik:
    image: traefik:v3.7.16
    container_name: aiflow4-traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=aiflow4-edge
      - --entrypoints.web.address=:80
      - --entrypoints.status.address=:8081
      - --ping=true
      - --ping.entrypoint=web
    ports: ["80:80", "8081:8081"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [edge, control]

  openobserve:
    image: openobserve/openobserve:v1.1.2
    container_name: aiflow4-openobserve
    restart: unless-stopped
    env_file: [/etc/aiflow/secrets/control/openobserve.env, ./o2.env]
    environment:
      ZO_DATA_DIR: /data
      ZO_BASE_URI: /o2
    volumes:
      - /srv/aiflow/control/data/openobserve:/data
    mem_limit: 1g
    labels:
      traefik.enable: "true"
      traefik.docker.network: aiflow4-edge
      traefik.http.routers.o2.rule: "PathPrefix(`/o2`)"
      traefik.http.routers.o2.entrypoints: web
      traefik.http.services.o2.loadbalancer.server.port: "5080"
    networks: [control, edge]

  gatus:
    image: twinproduction/gatus:v5.37.0
    container_name: aiflow4-gatus
    restart: unless-stopped
    environment:
      GATUS_CONFIG_PATH: /config/config.yaml
    volumes:
      - ./gatus.yaml:/config/config.yaml:ro
    labels:
      traefik.enable: "true"
      traefik.docker.network: aiflow4-edge
      traefik.http.routers.gatus.rule: "PathPrefix(`/`)"
      traefik.http.routers.gatus.entrypoints: status
      traefik.http.services.gatus.loadbalancer.server.port: "8080"
    networks: [control, edge]

  mailpit:
    image: axllent/mailpit:v1.31.6
    container_name: aiflow4-svc-mailpit
    restart: unless-stopped
    networks: [services]

networks:
  control: { name: aiflow4-control }
  services: { name: aiflow4-services }
  edge: { name: aiflow4-edge }
