<body>

      <button class="tab" role="tab" id="tab-cc" aria-controls="view-cc" aria-selected="true" data-act="view" data-menu-view data-view="cc">Dashboard</button>
      <button class="tab" role="tab" id="tab-work" aria-controls="view-work" aria-selected="false" data-act="view" data-menu-view data-view="work">Work board</button>

      <button class="tab" role="tab" id="tab-machines" aria-controls="view-machines" aria-selected="false" data-act="view" data-menu-view data-view="machines">Machines and AI</button>

      <button class="tab" role="tab" id="tab-licensing" aria-controls="view-licensing" aria-selected="false" data-act="view" data-menu-view data-view="licensing">Licence</button>
      <button class="tab" role="tab" id="tab-notifications" aria-controls="view-notifications" aria-selected="false" data-act="view" data-menu-view data-view="notifications">Notifications</button>
      <button class="tab" role="tab" id="tab-settings" aria-controls="view-settings" aria-selected="false" data-act="view" data-menu-view data-view="settings">Settings</button>
      <button class="tab" role="tab" id="tab-support" aria-controls="view-support" aria-selected="false" data-act="view" data-menu-view data-view="support">Support</button>
    </div>
    <label id="view-as-switch" class="iconbtn" hidden>View as <select id="view-as-role" aria-label="View as role"></select></label>
    <div class="spacer"></div>
    <span class="live" id="live" aria-live="polite"></span>
    <span class="envtag" id="envtag">lab</span>
    <a class="iconbtn" id="logs-nav" href="/logs" hidden title="Open the administrator log viewer">Host/service logs</a>
    <a class="iconbtn" id="help-link" href="/help/screens/cc.html" target="_blank" rel="noopener" title="Help for this screen">Help</a>
    <a class="iconbtn" href="/o2/" target="_blank" rel="noopener" title="Logs and metrics (OpenObserve)">Logs</a>
    <a class="iconbtn" href="/mail/" target="_blank" rel="noopener" title="Alert emails (Mailpit)">Alerts mail</a>
    <button class="iconbtn" data-act="search-open" aria-keyshortcuts="Control+K Meta+K" aria-label="Search views, projects, and tickets (Ctrl K)" title="Search · Ctrl K">Search <kbd>Ctrl K</kbd></button>
    <button class="iconbtn" data-act="theme" aria-label="Switch light or dark" title="Light or dark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="7"></circle><path d="M12 1a7 7 0 1 0 0 14z" fill="currentColor"></path><path d="M5 21h14M8 17v4m8-4v4"/></svg><span class="theme-label">Theme</span></button>

</header>

  <section class="view" id="view-work" role="tabpanel" aria-labelledby="tab-work" hidden><script src="/console-assets/run-inbox.js"></script>
    <div class="dhead" id="work-head"></div>
    <div id="work-body" class="view"></div>
  </section>
  <section class="view" id="view-delivery" role="tabpanel" aria-labelledby="tab-delivery" hidden>
    <div class="dhead" id="dhead"></div>
    <div id="dbody" class="view"></div>
  </section>
  <section class="view" id="view-sa" role="tabpanel" aria-labelledby="tab-sa" hidden></section>
  <section class="view" id="view-machines" role="tabpanel" aria-labelledby="tab-machines" hidden></section>
  <section class="view" id="view-users" role="tabpanel" aria-labelledby="tab-users" hidden><script src="/console-assets/user-form-state.js"></script></section>
  <section class="view" id="view-security" role="tabpanel" aria-labelledby="tab-security" hidden></section>
  <section class="view" id="view-lead" role="tabpanel" aria-labelledby="tab-lead" hidden></section>
  <section class="view" id="view-business" role="tabpanel" aria-labelledby="tab-business" hidden>
    <div class="dhead" id="bhead"></div>
    <div id="bbody" class="view"></div>
    <div id="bform"></div>
    <div id="bcr"></div>
  </section>
  <section class="view" id="view-review" role="tabpanel" aria-labelledby="tab-review" hidden></section>
  <section class="view" id="view-stakeholder" role="tabpanel" aria-labelledby="tab-stakeholder" hidden>
    <div class="dhead" id="shead"></div>
    <div id="sbody" class="view"></div>
  </section>
  <section class="view" id="view-knowledge" role="tabpanel" aria-labelledby="tab-knowledge" hidden></section>
  <section class="view" id="view-backup" role="tabpanel" aria-labelledby="tab-backup" hidden></section>
  <section class="view" id="view-integrations" role="tabpanel" aria-labelledby="tab-integrations" hidden></section>
  <section class="view" id="view-projects" role="tabpanel" aria-labelledby="tab-projects" hidden></section>
  <section class="view" id="view-licensing" role="tabpanel" aria-labelledby="tab-licensing" hidden><script src="/console-assets/licensing-notice.js"></script></section>
  <section class="view" id="view-notifications" role="tabpanel" aria-labelledby="tab-notifications" hidden></section>
  <section class="view" id="view-settings" role="tabpanel" aria-labelledby="tab-settings" hidden></section>
  <section class="view" id="view-support" role="tabpanel" aria-labelledby="tab-support" hidden></section>
</main>
<footer class="footer" id="footer">
  <div class="wrap">
    <span class="f-item"><span class="f-k">AI Flow</span><span class="f-v" id="f-version">—</span></span>
    <span class="f-item"><span class="f-k">Environment</span><span class="f-v" id="f-env">—</span></span>
    <span class="f-item"><span class="f-k">Control repo</span><span class="f-v" id="f-control">—</span></span>
    <nav class="f-links" aria-label="Operations tools">
      <a id="f-o2" href="/o2/" target="_blank" rel="noopener">OpenObserve</a>
      <a id="f-mail" href="/mail/" target="_blank" rel="noopener">Mailpit</a>
      <a id="f-gatus" href="/gatus/" target="_blank" rel="noopener">Gatus</a>
    </nav>
    <span class="f-copy">&copy; <span id="f-year">2026</span> JOOservices</span>
  </div>
</footer>
<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-labelledby="drawer-title"></aside>

<div class="sr-only" id="layout-live" role="status" aria-live="polite"></div>
<div class="command-search" id="command-search" hidden>
  <button class="command-scrim" type="button" data-act="search-close" aria-label="Close search"></button>
  <section class="command-dialog" role="dialog" aria-modal="true" aria-labelledby="command-search-title">
    <header><h2 id="command-search-title">Jump to a view, project, or ticket</h2><button class="btn sm" type="button" data-act="search-close">Close <kbd>Esc</kbd></button></header>
    <input id="command-query" type="search" autocomplete="off" placeholder="Search the console…" aria-label="Search views, projects, and tickets" aria-controls="command-results">
    <div class="command-results" id="command-results" role="listbox" aria-label="Search results"></div>
    <div class="command-hint"><kbd>Ctrl K</kbd> or <kbd>⌘ K</kbd> to open · <kbd>Esc</kbd> to close</div>
  </section>
</div>
