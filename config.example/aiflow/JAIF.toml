# JOOservices/config/aiflow/<anything>.toml: one file per Jira project.
[project]
name = "AI Flow"
jira_key = "JAIF"
repo = "ai-flow"          # directory under <company>/projects and the GitHub repository
company = "JOOservices"
# memory_url = "<configured service URL>" # enable shared memory and PostgreSQL scoped notes for this project
# database = "my-project" # optional: provision an isolated shared database for each ticket
ci_required = true
# human_on_deployment = false # opt out of automatic Human review for a Deployment section
# Optional project-owned post-merge hook. Keep the command empty to disable it.
deploy_command = ""
deploy_timeout_minutes = 30
deploy_on = "base"         # use "all" to include hotfix and release merges
workers = 1             # workers of this project (aiflow-work@JAIF-1); 0 = none of its own. Worker 1 serves only this project
