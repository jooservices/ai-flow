name: CI

on:
  pull_request:
    branches: [master, develop]
  push:
    branches: [master, develop]
  schedule:
    - cron: "17 2 * * *"  # the full clean-install acceptance test, every night
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}  # a push never cancels the nightly run
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: read

jobs:
  test:
    name: Test (Unit)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compile
        run: python3 -m compileall -q aiflow

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The blocking level is a repository variable (Settings > Variables), not a constant: LOW, MEDIUM, HIGH or CRITICAL.
      SECURITY_SEVERITY_THRESHOLD: ${{ vars.SECURITY_SEVERITY_THRESHOLD || 'HIGH' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build control-api image to scan
        run: docker build -f deploy/v4/control/Dockerfile -t aiflow4-control-api:scan .

      - name: Scan dependencies, repository and image (a finding at or above the level blocks the merge)
        run: bash deploy/v4/ci/security-scan.sh security-report aiflow4-control-api:scan

      - name: Summary
        if: always()
        run: |
          python3 -m aiflow.v4.core.security_report report --version "pull request" --revision "$GITHUB_SHA" \
            --threshold "$SECURITY_SEVERITY_THRESHOLD" \
            --check "Dependencies (uv.lock)=security-report/dependencies.json" \
            --check "Repository (secrets, misconfiguration)=security-report/repository.json" \
            --check "Container image=security-report/image.json" >> "$GITHUB_STEP_SUMMARY"

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache uv downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Install
        run: pip install uv==0.13.4 && uv sync --frozen

      - name: Documentation site builds
        run: uv run --frozen python -m aiflow.v4.core.docsite build --out build/docs-site

      - name: A screen or API change needs a documentation change
        if: github.event_name == 'pull_request'
        env:
          BASE: origin/${{ github.base_ref }}
        run: uv run --frozen python -m aiflow.v4.core.docsite check --base "$BASE"

  giant-files:
    name: Giant files
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check giant-file baseline
        env:
          BASE: ${{ github.event.pull_request.base.ref == 'develop' && github.event.pull_request.base.sha || 'origin/develop' }}
        run: python3 -m aiflow.v4.core.giant_files --base "$BASE" --head HEAD

  quality:
    name: Code quality
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache uv downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Install
        run: pip install uv==0.13.4 && uv sync --frozen --group dev

      - name: Lint, function size and layer rules (no third-party reviewer needed)
        env:
          BASE: ${{ github.event.pull_request.base.ref == 'develop' && github.event.pull_request.base.sha || 'origin/develop' }}
        run: uv run --frozen python -m aiflow.v4.core.quality_checks check --base "$BASE"

  # The v4 suite runs on parallel runners (JAIF-431): balanced shards of the test files, the browser journeys, and the
  # scale proof (JAIF-432, not a required check). Each runner has its own Redis and PostgreSQL. The required check
  # "Test (v4)" is the job `v4` below: it passes only when every shard and the browser journeys passed.
  v4-shard:
    name: Test (v4) shard ${{ matrix.shard }}
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      redis:
        image: redis:8.2.10-bookworm
        ports: ["6379:6379"]
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_USER: aiflow
          POSTGRES_PASSWORD: test
          POSTGRES_DB: aiflow4
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aiflow -d aiflow4"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache uv downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Install
        run: |
          pip install uv==0.13.4
          uv sync --frozen --group dev

      - name: Tests of this shard (real Redis and PostgreSQL)
        env:
          AIFLOW4_TEST_REDIS_URL: redis://localhost:6379/5
          AIFLOW4_TEST_DATABASE_URL: postgresql://aiflow:test@localhost:5432/aiflow4
        run: |
          files="$(uv run python -m aiflow.v4.core.test_shards files --index ${{ matrix.shard }} --total 4)"
          test -n "$files"
          uv run pytest $files -p no:warnings

  v4-browser:
    name: Test (v4) browser journeys
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:8.2.10-bookworm
        ports: ["6379:6379"]
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_USER: aiflow
          POSTGRES_PASSWORD: test
          POSTGRES_DB: aiflow4
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aiflow -d aiflow4"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache uv downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Install
        run: |
          pip install uv==0.13.4
          uv sync --frozen --group dev
          npm install --global playwright@1.64.1
          playwright install chromium --with-deps

      - name: Browser journeys (real Redis and PostgreSQL)
        env:
          AIFLOW4_TEST_REDIS_URL: redis://localhost:6379/5
          AIFLOW4_TEST_DATABASE_URL: postgresql://aiflow:test@localhost:5432/aiflow4
          AIFLOW4_PLAYWRIGHT_TRACE_DIR: ${{ runner.temp }}/aiflow-playwright-traces
        run: uv run pytest tests/v4/test_console_browser.py tests/v4/test_log_viewer_browser.py -p no:warnings

      - name: Upload sanitized Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: v4-console-playwright-traces
          path: ${{ runner.temp }}/aiflow-playwright-traces/
          if-no-files-found: ignore
          retention-days: 14

  # The 100/50/200 benchmark is sensitive to runner speed, so it is not a required check: it runs on its own against a
  # fresh PostgreSQL service on every pull request and nightly, and its result is read next to the pull request.
  v4-scale:
    name: Scale proof (not required)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:8.2.10-bookworm
        ports: ["6379:6379"]
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_USER: aiflow
          POSTGRES_PASSWORD: test
          POSTGRES_DB: aiflow4
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aiflow -d aiflow4"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache uv downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Install
        run: |
          pip install uv==0.13.4
          uv sync --frozen --group dev

      - name: Scale proof (real Redis and PostgreSQL)
        env:
          AIFLOW4_TEST_REDIS_URL: redis://localhost:6379/5
          AIFLOW4_TEST_DATABASE_URL: postgresql://aiflow:test@localhost:5432/aiflow4
        run: uv run pytest tests/v4/test_scale_proof.py -p no:warnings

  v4:
    name: Test (v4)
    if: always() && github.event_name != 'schedule'
    needs: [v4-shard, v4-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard and the browser journeys passed
        env:
          RESULTS: ${{ needs.v4-shard.result }} ${{ needs.v4-browser.result }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do test "$result" = success || exit 1; done

  # Clean-install acceptance test (docs/v4/clean-install-acceptance.md): the fast version on every pull request
  # that touches install, deploy, control or node code ...
  acceptance-fast:
    name: Clean-install acceptance (fast)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:8.2.10-bookworm
        ports: ["6379:6379"]
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_USER: aiflow
          POSTGRES_PASSWORD: test
          POSTGRES_DB: aiflow4
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aiflow -d aiflow4"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Does the pull request touch install, deploy, control or node code?
        id: touched
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE" HEAD | grep -E '^(aiflow/v4/(install|control|node)/|deploy/v4/|tests/v4/test_clean_install_acceptance\.py|\.github/workflows/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "no install, deploy, control or node change: the fast acceptance test is skipped"
          fi

      - name: Install
        if: steps.touched.outputs.run == 'true'
        run: |
          pip install uv==0.13.4
          uv sync --frozen --group dev
          npm install --global playwright@1.64.1
          playwright install chromium --with-deps

      - name: Acceptance test (fast)
        if: steps.touched.outputs.run == 'true'
        env:
          AIFLOW4_TEST_REDIS_URL: redis://localhost:6379/5
          AIFLOW4_TEST_DATABASE_URL: postgresql://aiflow:test@localhost:5432/aiflow4
          AIFLOW4_PLAYWRIGHT_TRACE_DIR: ${{ runner.temp }}/aiflow-playwright-traces
        run: bash deploy/v4/ci/clean-install-acceptance.sh fast

      - name: Upload fast acceptance logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clean-install-acceptance-fast
          path: ${{ runner.temp }}/aiflow-acceptance-logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload clean-install acceptance Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clean-install-acceptance-fast-playwright-traces
          path: ${{ runner.temp }}/aiflow-playwright-traces/
          if-no-files-found: ignore
          retention-days: 14

  # ... and the full version every night (and on demand).
  acceptance-full:
    name: Clean-install acceptance (full, nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      redis:
        image: redis:8.2.10-bookworm
        ports: ["6379:6379"]
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_USER: aiflow
          POSTGRES_PASSWORD: test
          POSTGRES_DB: aiflow4
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aiflow -d aiflow4"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install
        run: |
          pip install uv==0.13.4
          uv sync --frozen --group dev
          npm install --global playwright@1.64.1
          playwright install chromium --with-deps

      - name: Two newest published releases for the systemd install, upgrade and rollback
        id: releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LOGS="$RUNNER_TEMP/aiflow-acceptance-logs"
          mkdir -p "$LOGS"
          QUERY_LOG="$LOGS/release-list.log"
          printf 'Querying published releases for %s\n' "$GITHUB_REPOSITORY" > "$QUERY_LOG"
          # A successful empty query means no published release exists. Query/auth failures must fail this job.
          if TAGS=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json isDraft,isPrerelease,publishedAt,tagName \
            --jq '[.[] | select(.isDraft == false and .isPrerelease == false)] | sort_by(.publishedAt) | reverse | .[:2] | .[].tagName' 2>>"$QUERY_LOG"); then
            printf 'Published release query succeeded. Results:\n%s\n' "$TAGS" >> "$QUERY_LOG"
          else
            status=$?
            {
              printf 'gh release list failed with exit status %s. Output:\n' "$status"
              printf '%s\n' "$TAGS"
            } >> "$QUERY_LOG"
            exit "$status"
          fi
          echo "target=$(printf '%s\n' "$TAGS" | sed -n 1p)" >> "$GITHUB_OUTPUT"
          echo "previous=$(printf '%s\n' "$TAGS" | sed -n 2p)" >> "$GITHUB_OUTPUT"

      - name: Acceptance test (full)
        env:
          AIFLOW4_TEST_REDIS_URL: redis://localhost:6379/5
          AIFLOW4_TEST_DATABASE_URL: postgresql://aiflow:test@localhost:5432/aiflow4
          ACCEPTANCE_PREVIOUS: ${{ steps.releases.outputs.previous }}
          ACCEPTANCE_TARGET: ${{ steps.releases.outputs.target }}
          AIFLOW4_PLAYWRIGHT_TRACE_DIR: ${{ runner.temp }}/aiflow-playwright-traces
        run: bash deploy/v4/ci/clean-install-acceptance.sh full

      - name: Upload nightly acceptance logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clean-install-acceptance-nightly
          path: ${{ runner.temp }}/aiflow-acceptance-logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload nightly acceptance Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clean-install-acceptance-nightly-playwright-traces
          path: ${{ runner.temp }}/aiflow-playwright-traces/
          if-no-files-found: ignore
          retention-days: 14

  # A failing nightly run opens a bug ticket (a GitHub issue labelled bug) with the log.
  acceptance-bug:
    name: Open a bug ticket for the failed nightly run
    needs: [acceptance-full]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download nightly acceptance logs
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: clean-install-acceptance-nightly
          path: ${{ runner.temp }}/aiflow-acceptance-logs
      - name: Ensure nightly bug ticket has diagnostic logs
        if: always()
        env:
          ACCEPTANCE_LOG_DIR: ${{ runner.temp }}/aiflow-acceptance-logs
        run: |
          mkdir -p "$ACCEPTANCE_LOG_DIR"
          if ! compgen -G "$ACCEPTANCE_LOG_DIR/*.log" >/dev/null; then
            printf 'The acceptance log artifact was unavailable; inspect the workflow run for job logs.\n' > "$ACCEPTANCE_LOG_DIR/artifact-download.log"
          fi
      - name: Open the bug ticket
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE_LOG_DIR: ${{ runner.temp }}/aiflow-acceptance-logs
        run: bash deploy/v4/ci/open-bug-ticket.sh "Clean-install acceptance test failed (nightly ${GITHUB_SHA::8})"
