# JOOservices/config/aiflow.toml: ALL general settings of the AI Flow supervisor (git-ignored: copy it by hand to every machine,
# then `bin/aiflow-work check` and `bin/aiflow-work restart`; settings are read once when a worker starts).
# Where things live:
#   this file             what the supervisor does (roles, merge rules, timing, workers per machine)
#   config/aiflow/*.toml  one file per Jira project (see aiflow/JAIF.toml)
#   Workspaces/.env       secrets only (tokens, passwords)
#   ai-flow/.env          identity and connection of THIS machine (AIFLOW_MACHINE, Redis); see .env.example
# Precedence: project file > [defaults] > the legacy .env value. [runtime] > the legacy .env value.

# ---------------------------------------------------------------------------------------------------------------------------
# [defaults]: applies to every project; a project file may override each key.
# ---------------------------------------------------------------------------------------------------------------------------
[defaults]
base = "develop"                 # branch every ticket starts from and its pull request targets
hotfix_base = "master"           # branch of tickets with Type Hotfix (also the merge-back source)
developer = "Codex:gpt-6-luna:xhigh"  # developer AI, as Agent[:model[:effort]]; the ticket fields Agent (AI) / AI Model win
reviewer = "Grok"                # reviewer AI (never the developer when another AI is available); falls back to another AI if down
qa = "Claude:sonnet"             # QA AI, same rule as the reviewer
require_human = false            # true: every ticket stops in Human review before the merge (ticket field Require human overrides)
human_on_deployment = true       # true: a developer hand-over whose Deployment section says something forces Human review
auto_merge = true                # false: the PR gate stops after QA and waits for the owner to merge
ci_required = false              # true: a pull request without CI checks is not merged
merge_method = "merge"           # merge | squash | rebase
max_parallel = 0                 # tickets of ONE Jira project worked at the same time; 0 = no limit
highest_developer = "Claude"     # developer of tickets with Priority Highest (also taken first)
release_check = ""               # command that runs the full test suite of a Release ticket, written by the project
tag_prefix = "v"                 # release tags are <tag_prefix><Version>
# deploy_command = ""            # command run after a ticket is merged (per project, see JAIF-63); empty = nothing
# deploy_timeout_minutes = 30    # the deploy command is stopped after this many minutes
# deploy_on = "base"             # base: only merges into `base`; all: every merge

# ---------------------------------------------------------------------------------------------------------------------------
# [runtime]: tuning of the supervisor. Every key is optional. The values shown are the settings in use on the JOOservices workstation; where one differs
# from the built-in default (used when the key is missing) the comment says so.
# ---------------------------------------------------------------------------------------------------------------------------
[runtime]
# --- worker loop ---
poll_seconds = 30                # how often an idle worker looks for a ticket
heartbeat_seconds = 20           # how often a worker renews its lease while it works
lease_seconds = 120              # a lease without a heartbeat for this long is dead; another worker takes the ticket over
heartbeat_stale_seconds = 300    # health check: a worker heartbeat older than this means the worker is down
orphan_grace_seconds = 180       # wait before treating an AI process without a lease as an orphan
worker_max_minutes = 0           # a worker leaves (systemd restarts it) after this many minutes; 0 = never
# --- one AI step ---
idle_minutes = 30                # an AI that prints nothing for this long is stopped
max_minutes = 180                # hard time limit of one AI step
max_attempts = 3                 # failed AI attempts on a step before the ticket is Blocked (Attempts)
wait_note_minutes = 20           # write a "waiting for an AI" note on a ticket after this long (built-in default: 10)
# --- choosing and protecting AIs ---
agent_order = ["Codex", "Claude", "Grok", "OpenCode"]  # preference when several AIs could take a step, first wins (built-in default: Claude, Codex, OpenCode)
explicit_only_ais = ["OpenCode"]  # AIs used only when the ticket names them (never picked automatically)
opencode_model = "opencode/deepseek-v4.1-flash-free"  # model used when OpenCode is the developer
quota_cooldown_minutes = 30      # an AI out of usage or balance is skipped by every machine for this long
quota_block_minutes = 30         # no AI available on any machine for this long: the ticket is Blocked (Quota/Offline)
recheck_seconds = 120            # how often a ticket waiting for an AI is looked at again
probe_hours = 3                  # every AI is probed with one word this often; one that fails leaves the pool
# --- pull-request gate ---
ci_wait_minutes = 90             # CI without a result for this long: the ticket is Blocked (CI)
feedback_settle_minutes = 5      # wait after marking the PR ready so the review bots can comment
gate_poll_seconds = 60           # how often the gate looks at a pull request
max_cycles = 6                   # rework rounds on one ticket before it is Blocked
ignored_authors = ["codecov-commenter", "github-actions", "sonarqubecloud", "sonarcloud", "dependabot", "codeql", "github-advanced-security"]  # automation: their comments are not feedback
# --- health and visibility ---
health_ticket = "JAIF-12"        # ticket that receives health alerts and the daily AI usage summary (built-in default: none, no alert is written)
# workspace_name = "WSL"         # name written in the Jira field Workspace; default: WSL / Mac by machine, else the machine name
# --- Redis namespace (host, port and password are per machine: see .env.example) ---
redis_prefix = "aiworkflow:"     # prefix of every key; shared by all machines, so keep it equal everywhere
# --- Jira fields of AI Flow, by NAME (ids are looked up in Jira at runtime; `bin/aiflow-setup <KEY>` creates them) ---
# Keep the names unless you rename the fields in Jira; a `customfield_NNNNN` id is also accepted.
workspace_field = "Workspace"                # machine working on the ticket
blocked_reason_field = "Blocked reason"      # why a ticket is Blocked, as `Kind: reason`
require_human_field = "Require human"        # Yes: the ticket stops in Human review before the merge
model_field = "AI Model"                     # model per ticket, as `<AI>:<Model>`
type_field = "Type"                          # Feature, Bug, Hotfix, Chore, Docs, Refactor
version_field = "Version"                    # x.y.z of a Release ticket

# ---------------------------------------------------------------------------------------------------------------------------
# [machines.<name>]: <name> is AIFLOW_MACHINE of that machine (see .env.example).
# ---------------------------------------------------------------------------------------------------------------------------
# The workers of a machine are kept by the control (aiflow-control.service, started with `bin/install-wsl-service --control`):
#   each project file says how many workers it has (`workers = N` in config/aiflow/<KEY>.toml: aiflow-work@<KEY>-1 ... @<KEY>-N);
#   worker 1 of a project serves only that project, the others take their own project first and then tickets of other projects.
# workers      = shared workers (aiflow-work@1 ... @N) that serve every project; 0 when every project has its own.
# max_workers  = the most workers (shared + all projects) this machine may run; a configuration above it is refused.
# ai_limits    = concurrent AI sessions of the whole machine (all workers together); a missing AI is unlimited, 0 turns it off.
#                Workers beyond the limits wait for an AI, so keep the limits and max_workers in proportion (`aiflow-work check` warns).
# A change is picked up by the control within 30 seconds (workers are started, retired softly after their step, restarted).
[machines.wsl]
workers = 2
max_workers = 12
# [machines.wsl.ai_limits]
# codex = 4
# claude = 2
# opencode = 4
# grok = 2

[machines.mac]
workers = 1
