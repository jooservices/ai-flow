name: CI post-merge

# Re-verifies develop and master after every push (JAIF-603). It is not part of the pull request pipeline and no
# branch protection rule requires it: a failure opens a bug ticket instead of blocking a merge.
on:
  push:
    branches: [master, develop]

concurrency:
  group: ci-post-merge-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Post-merge unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compile
        run: python3 -m compileall -q aiflow

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

  v4-shard:
    name: Post-merge v4 shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      redis:
        image: redis:8.2.10-bookworm
        ports: ["6379:6379"]
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_USER: aiflow
          POSTGRES_PASSWORD: test
          POSTGRES_DB: aiflow4
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aiflow -d aiflow4"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache uv downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Install
        run: |
          pip install uv==0.13.4
          uv sync --frozen --group dev

      - name: Tests of this shard (real Redis and PostgreSQL)
        env:
          AIFLOW4_TEST_REDIS_URL: redis://localhost:6379/5
          AIFLOW4_TEST_DATABASE_URL: postgresql://aiflow:test@localhost:5432/aiflow4
        run: |
          files="$(uv run python -m aiflow.v4.core.test_shards files --index ${{ matrix.shard }} --total 4)"
          test -n "$files"
          # shellcheck disable=SC2086 # the shard lists test paths separated by spaces; splitting them is intended
          uv run pytest $files -p no:warnings

  report:
    name: Report a post-merge failure
    needs: [unit, v4-shard]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open a bug ticket
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        run: |
          gh label create bug --repo "$GITHUB_REPOSITORY" --color d73a4a --description "Something is broken" >/dev/null 2>&1 || true
          gh issue create --repo "$GITHUB_REPOSITORY" --label bug \
            --title "Post-merge checks failed on $REF_NAME (${COMMIT::8})" \
            --body "The post-merge checks of \`$REF_NAME\` failed at \`$COMMIT\`: $RUN_URL"
