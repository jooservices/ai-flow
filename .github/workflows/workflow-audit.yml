name: Workflow audit

on:
  pull_request:
    paths: [".github/**"]  # runs only when a workflow, action or other file under .github changes

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Lint and audit workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint workflow syntax with actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: 1.7.12
          pyflakes: false

      - name: Install zizmor
        run: pip install zizmor==1.32.0

      - name: Audit workflow security with zizmor
        env:
          GH_TOKEN: ${{ github.token }}  # lets zizmor check pinned action references against the repository
        run: zizmor --format plain .github/workflows
