<meta name="claude:viewport-fit-sides" content="cover">
<title>AI Flow Command Center V2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout concept: one menu of role views. Dashboard (work, and AI with machines) and the Work board come first and are open to
   everyone. Projects are picked with a searchable list that scales to hundreds, never a row of buttons. Warm graphite ground;
   one colour per AI, always named in text; status is written in words, never colour alone. */

/* Layout concept (V2): the owner's day in one scroll. Summary cards, then the Kanban with the owner's queue beside it,
   then the roadmap (a bar selects an epic and filters the Kanban), then AI usage and quota per AI.
   Warm graphite ground; one colour per AI provider, always named in text; status uses words, not colour alone. */
:root{
  --bg:#121110; --panel:#1a1917; --panel2:#201e1b; --line:#2d2a26; --text:#ece7df; --muted:#9a9388; --faint:#6b655c;
  --claude:#d98b5f; --codex:#58c4a3; --grok:#b69df2; --opencode:#8fa3b5;
  --ok:#86c77f; --warn:#e6bb52; --crit:#e46e5e; --focus:#f0e6d2;
  --font:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:14px/1.45 var(--font);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:18px 0 4px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px}
.brand i{width:26px;height:26px;border-radius:8px;background:conic-gradient(from 210deg,var(--claude),var(--codex),var(--grok),var(--claude));display:grid;place-items:center}
.brand i::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--bg)}
.brand small{font-weight:500;color:var(--muted);font-size:12px;margin-left:4px}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:7px;color:var(--muted);font-weight:600;font-size:13px;transition:background .2s,color .2s}
.seg button[aria-pressed=true]{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.sp{flex:1}
.sys{display:flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:13px;color:var(--muted);transition:border-color .2s}
.sys:hover{border-color:var(--muted);color:var(--text)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(134,199,127,0)}0%{box-shadow:0 0 0 0 rgba(134,199,127,.6)}}
.btn{padding:7px 13px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:13px;transition:border-color .2s,transform .15s}
.btn:hover{border-color:var(--muted)} .btn:active{transform:scale(.97)}
.btn.primary{background:var(--text);color:var(--bg);border-color:var(--text)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.k .lab{color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.k .val{font-size:34px;font-weight:800;letter-spacing:-.02em;margin-top:4px;display:flex;align-items:baseline;gap:8px}
.k .val small{font-size:13px;font-weight:600;color:var(--muted)}
.k .sub{color:var(--muted);font-size:12px;margin-top:2px;display:flex;justify-content:space-between;align-items:end;gap:8px}
.k.hot{border-color:#5a4423;background:linear-gradient(180deg,#221c13,var(--panel))}
.k.hot .val{color:var(--warn)}
.up{color:var(--ok)}
h2{margin:0 0 12px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h2 span{font-weight:500;text-transform:none;letter-spacing:0;font-size:12px}
.main{display:grid;grid-template-columns:minmax(0,3fr) minmax(270px,1fr);gap:12px;align-items:start}
.bar-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.bar-tools select,.bar-tools input{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:13px;min-width:0}
.bar-tools input{width:170px}
.fl{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--warn);color:var(--warn);font-size:12px;font-weight:600}
.fl button{color:var(--warn);font-weight:800;padding:0 2px}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:0 0 10px}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg i{width:9px;height:9px;border-radius:50%}
.pipe{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.col{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.col h3{margin:0 0 2px;font-size:11px;font-weight:700;color:var(--muted);display:flex;justify-content:space-between;letter-spacing:.03em;white-space:nowrap}
.col h3 b{color:var(--text);font-family:var(--mono)}
.col.attn{border-color:#5a4423}
.stack{display:flex;flex-direction:column;gap:6px;max-height:560px;overflow-y:auto;padding-right:2px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.tk{flex:none;display:grid;gap:5px;padding:8px;border-radius:9px;background:var(--bg);border:1px solid var(--line);text-align:left;position:relative;overflow:hidden;animation:drop .45s cubic-bezier(.2,.9,.3,1.2) both;transition:border-color .2s,transform .2s;min-width:0}
.tk:hover{border-color:var(--muted);transform:translateY(-1px)}
.tk .id{font-family:var(--mono);font-size:10.5px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.tk .ti{font-size:12px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tk .ft{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--muted)}
.tk .ft i{width:7px;height:7px;border-radius:50%;flex:none}
.tk.run::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--codex),transparent);background-size:50% 100%;background-repeat:no-repeat;animation:slide 1.8s linear infinite}
@keyframes slide{from{background-position:-60% 0}to{background-position:160% 0}}
@keyframes drop{from{opacity:0;transform:translateY(-8px) scale(.96)}to{opacity:1;transform:none}}
.older{font-size:11px;color:var(--faint);text-align:center;padding:4px 0}
.none{font-size:11px;color:var(--faint);text-align:center;padding:14px 0}
.ask{display:flex;flex-direction:column;gap:10px}
.q{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:12px;display:grid;gap:8px;animation:drop .5s both;transition:opacity .4s,transform .4s}
.q.gone{opacity:0;transform:translateX(30px)}
.q .top{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted)}
.q p{margin:0;font-size:13px}
.q .act{display:flex;gap:6px;flex-wrap:wrap}
.tag{padding:2px 7px;border-radius:6px;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line);color:var(--muted)}
.tag.crit{color:var(--crit);border-color:#5b2c26}.tag.warn{color:var(--warn);border-color:#5a4423}.tag.ok{color:var(--ok);border-color:#2f4a2d}
.empty{color:var(--muted);text-align:center;padding:28px 8px;border:1px dashed var(--line);border-radius:11px}
.feed{display:grid;gap:6px;max-height:112px;overflow:hidden;font-size:12px;color:var(--muted);font-family:var(--mono);margin-top:4px}
.feed div{animation:drop .4s both;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.feed b{color:var(--text);font-weight:500}
/* roadmap */
.axis,.lane{display:grid;grid-template-columns:190px minmax(0,1fr);gap:12px}
.scale{position:relative;height:20px;font-family:var(--mono);font-size:11px;color:var(--faint)}
.scale span{position:absolute;transform:translateX(-50%)}
.gwrap{position:relative}
.lane{align-items:center;padding:7px 0;border-top:1px solid var(--line);cursor:pointer;border-radius:8px;transition:background .2s;text-align:left;width:100%}
.lane:hover{background:var(--panel2)}
.lane.sel{background:var(--panel2);box-shadow:inset 0 0 0 1px var(--warn)}
.lane .nm{display:flex;flex-direction:column;min-width:0;font-weight:600;font-size:13px}
.lane .nm small{color:var(--faint);font-weight:500;font-size:11px;font-family:var(--mono)}
.track{position:relative;height:28px;border-radius:8px;background:repeating-linear-gradient(90deg,transparent 0 calc(100%/4 - 1px),var(--line) calc(100%/4 - 1px) calc(100%/4))}
.gb{position:absolute;top:3px;bottom:3px;border-radius:8px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.gb i{position:absolute;inset:0 auto 0 0;width:0;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.gb span{position:absolute;inset:0;display:flex;align-items:center;padding:0 9px;font-size:11px;font-family:var(--mono);text-shadow:0 1px 2px rgba(0,0,0,.7);white-space:nowrap}
.today{position:absolute;top:-6px;bottom:0;border-left:2px dashed var(--warn);pointer-events:none;z-index:2}
.today::before{content:"today";position:absolute;top:-14px;left:-17px;font:500 10px var(--mono);color:var(--warn)}
.hint{color:var(--faint);font-size:12px}
/* usage */
.lower{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:12px;align-items:start}
.chart{position:relative}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.lg{display:flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:var(--muted);transition:opacity .2s}
.lg i{width:8px;height:8px;border-radius:50%}.lg[aria-pressed=false]{opacity:.35}
svg text{font-family:var(--mono);fill:var(--muted);font-size:10px}
.tip{position:absolute;pointer-events:none;background:#0c0b0a;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:12px;opacity:0;transition:opacity .15s;white-space:nowrap;z-index:3}
.tip b{display:block;margin-bottom:3px;font-family:var(--mono)}
.share{display:flex;height:14px;border-radius:7px;overflow:hidden;border:1px solid var(--line);background:var(--bg)}
.share i{display:block;height:100%;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.shl{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted);font-family:var(--mono)}
.qa{display:grid;gap:12px}
.qp{border:1px solid var(--line);border-radius:12px;background:var(--panel2);padding:12px;display:grid;gap:9px}
.qp .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.qp .hd b{display:flex;align-items:center;gap:8px;font-size:14px}
.qp .hd b i{width:10px;height:10px;border-radius:50%}
.qp .hd span{font-size:12px;color:var(--muted)}
.meter{height:9px;border-radius:5px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.qrow{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.qrow b{color:var(--text);font-family:var(--mono);font-weight:500}
details.accs summary{cursor:pointer;color:var(--muted);font-size:12px;list-style:none}
details.accs summary::before{content:"▸ ";} details[open].accs summary::before{content:"▾ ";}
.accrows{display:grid;gap:5px;margin-top:8px}
.accrow{display:grid;grid-template-columns:minmax(0,1fr) 54px 92px;gap:8px;font-size:12px;align-items:center}
.accrow .mono{color:var(--muted)}
.state{font-size:11px;font-weight:700;text-align:right}
.state.ready{color:var(--ok)}.state.low{color:var(--warn)}.state.fail{color:var(--crit)}
/* drawers */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--panel);border-left:1px solid var(--line);padding:22px max(18px,env(safe-area-inset-right,0px)) 22px 22px;transform:translateX(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:20;overflow:auto;display:grid;gap:14px;align-content:start}
.drawer.open{transform:none;box-shadow:-30px 0 60px rgba(0,0,0,.5)}
.drawer h4{margin:0;font-size:18px;line-height:1.3}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .3s;z-index:19}.scrim.on{opacity:1;pointer-events:auto}
.tl{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:14px 1fr;gap:10px;font-size:13px}
.tl li i{width:10px;height:10px;border-radius:50%;background:var(--line);margin-top:5px}
.tl li.done i{background:var(--ok)}.tl li.cur i{background:var(--warn);box-shadow:0 0 0 4px rgba(230,187,82,.2)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:6px 8px 6px 0}
td{padding:9px 8px 9px 0;border-top:1px solid var(--line)}
@media (max-width:1180px){.main,.lower{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.pipe{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:760px){.pipe{grid-template-columns:repeat(2,minmax(0,1fr))}.axis,.lane{grid-template-columns:104px minmax(0,1fr)}.bar-tools input{width:100%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
[hidden]{display:none!important}
/* ----- app shell (V2 with the role menu of the current console) ----- */
.tabs{display:flex;gap:2px;align-items:center;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin-top:6px;padding-bottom:0}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:11px 14px;color:var(--muted);font-weight:600;font-size:14px;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .2s,border-color .2s}
.tab:hover{color:var(--text)}
.tab[aria-selected=true]{color:var(--text);border-bottom-color:var(--warn)}
.tab.key{font-weight:800}
.tabs .div{width:1px;height:18px;background:var(--line);margin:0 8px;flex:none}
.tab .badge{margin-left:6px;background:var(--warn);color:#2a1d05;border-radius:999px;font-size:11px;font-weight:800;padding:1px 7px}
.viewas{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.viewas select{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px 9px;font-size:13px}
.page{display:flex;flex-direction:column;gap:12px}
.page>.lead{margin:2px 0 4px;color:var(--muted);max-width:75ch}
.page>h1{margin:6px 0 0;font-size:22px;letter-spacing:-.01em}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.funnel{display:grid;gap:8px}
.fr{display:grid;grid-template-columns:104px minmax(0,1fr) 46px;gap:10px;align-items:center;font-size:13px;cursor:pointer;border-radius:8px;padding:2px 4px;text-align:left;width:100%}
.fr:hover{background:var(--panel2)}
.fr .b{height:14px;border-radius:7px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.fr .b i{display:block;height:100%;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.fr b{font-family:var(--mono);text-align:right}
.hbars{display:grid;gap:9px}
.hb{display:grid;grid-template-columns:120px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:13px}
.hb .b{height:12px;border-radius:6px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.hb .b i{display:block;height:100%;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.hb span:last-child{font-family:var(--mono);text-align:right;color:var(--muted)}
.stk{display:flex;height:22px;border-radius:7px;overflow:hidden;border:1px solid var(--line);background:var(--bg)}
.stk i{display:block;height:100%;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.keyl{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--muted)}
.keyl span{display:inline-flex;align-items:center;gap:6px}.keyl i{width:9px;height:9px;border-radius:3px}
.dt{width:100%;border-collapse:collapse;font-size:13px}
.dt th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:6px 10px 8px 0;white-space:nowrap}
.dt td{padding:10px 10px 10px 0;border-top:1px solid var(--line);vertical-align:middle}
.dt .num{font-family:var(--mono);text-align:right;white-space:nowrap}
.scroll{overflow-x:auto}
.pillstate{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;border:1px solid var(--line);white-space:nowrap}
.pillstate.ok{color:var(--ok);border-color:#2f4a2d}.pillstate.warn{color:var(--warn);border-color:#5a4423}.pillstate.crit{color:var(--crit);border-color:#5b2c26}
.usebar{display:flex;align-items:center;gap:8px;min-width:130px;font-family:var(--mono);font-size:12px}
.usebar .b{flex:1;height:8px;border-radius:4px;background:var(--bg);border:1px solid var(--line);overflow:hidden}.usebar .b i{display:block;height:100%}
.cmd{font-family:var(--mono);font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow-x:auto;white-space:nowrap;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toggle{width:40px;height:22px;border-radius:11px;background:var(--line);position:relative;transition:background .2s;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--text);transition:transform .2s}
.toggle[aria-pressed=true]{background:var(--ok)}.toggle[aria-pressed=true]::after{transform:translateX(18px)}
.fld{display:grid;gap:5px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.fld input,.fld select,.fld textarea,select.in,input.in{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14px;text-transform:none;letter-spacing:0;font-weight:500;width:100%;min-width:0}
.fld textarea{min-height:84px;resize:vertical}
.assess{display:grid;gap:8px}
.crit2{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:13px;display:grid;gap:5px;animation:drop .5s both}
.shimmer{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--line),var(--panel2),var(--line));background-size:200% 100%;animation:sh 1.1s infinite}
@keyframes sh{to{background-position:-200% 0}}
.rev{display:grid;gap:10px}
.rev .hd{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--muted)}
.rev h3{margin:0;font-size:16px}
.chk{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.chk span b{color:var(--ok)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:11px;font-weight:700;font-size:13px;opacity:0;transition:all .3s;z-index:40;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:900px){.grid2,.grid3{grid-template-columns:1fr}.viewas{display:none}}

.dt td:first-child{white-space:nowrap}
@media (min-width:900px){.qa{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* ----- V3 additions: project picker, command bar, sub tabs, management pages ----- */
.pick{display:inline-flex;align-items:center;gap:10px;padding:7px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-weight:600;font-size:13px;min-width:0;max-width:100%;transition:border-color .2s}
.pick:hover{border-color:var(--muted)}
.pick .k{font-family:var(--mono);color:var(--warn);font-size:12px}
.pick .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
