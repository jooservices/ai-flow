# JOOservices/config/aiflow.toml: general settings of AI Flow. Secrets stay in Workspaces/.env.
# A value of a project file beats [defaults], which beats the legacy .env value.

[defaults]
base = "develop"          # branch every ticket starts from
hotfix_base = "master"    # branch of Type Hotfix
developer = "Codex:gpt-6-luna:xhigh"
reviewer = "Grok"
qa = "Claude:sonnet"
require_human = false     # true: every ticket stops in Human review before the merge
human_on_deployment = true # false: skip automatic Human review for a Deployment section
auto_merge = true         # false: the PR gate stops after QA and waits for the owner
ci_required = false       # true: a PR without CI checks is not merged
merge_method = "merge"    # merge | squash | rebase
max_parallel = 0          # tickets of one Jira project running at the same time, 0 = no limit
highest_developer = "Claude"  # developer of the tickets with priority Highest
release_check = ""        # command that runs the full test suite (and e2e) of a Release ticket, written by the project
tag_prefix = "v"          # release tags are <prefix><version>

# Number of workers (aiflow-work@1 ... @N) per machine; the name is AIFLOW_MACHINE.
[machines.wsl]
workers = 2

[machines.mac]
workers = 1
