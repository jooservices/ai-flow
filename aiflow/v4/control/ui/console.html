<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI Flow Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#F7F8FB; --line:#D9DFE9; --line-soft:#E9EDF3;
  --fg:#101828; --muted:#4F5D77; --faint:#8C96AA;
  --accent:#2453D6; --accent-weak:rgba(36,83,214,.10); --accent-fg:#FFFFFF;
  --good:#0F7548; --good-weak:rgba(15,117,72,.12);
  --warn:#8F5200; --warn-weak:rgba(176,104,0,.14);
  --crit:#BB2727; --crit-weak:rgba(187,39,39,.12);
  --track:#E2E7EF; --overlay:rgba(16,24,40,.38); --shadow:0 18px 50px rgba(16,24,40,.18);
  --f-ui:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-cond:"IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0F1E; --surface:#111933; --surface-2:#0D1429; --line:#25314F; --line-soft:#1A2441;
    --fg:#E7ECF6; --muted:#A1ADC7; --faint:#6E7B99;
    --accent:#88AAFF; --accent-weak:rgba(136,170,255,.15); --accent-fg:#0A0F1E;
    --good:#52DB9E; --good-weak:rgba(82,219,158,.14);
    --warn:#F3B649; --warn-weak:rgba(243,182,73,.15);
    --crit:#FF7E7E; --crit-weak:rgba(255,126,126,.15);
    --track:#1D2847; --overlay:rgba(3,6,15,.62); --shadow:0 20px 60px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0F1E; --surface:#111933; --surface-2:#0D1429; --line:#25314F; --line-soft:#1A2441;
  --fg:#E7ECF6; --muted:#A1ADC7; --faint:#6E7B99;
  --accent:#88AAFF; --accent-weak:rgba(136,170,255,.15); --accent-fg:#0A0F1E;
  --good:#52DB9E; --good-weak:rgba(82,219,158,.14);
  --warn:#F3B649; --warn-weak:rgba(243,182,73,.15);
  --crit:#FF7E7E; --crit-weak:rgba(255,126,126,.15);
  --track:#1D2847; --overlay:rgba(3,6,15,.62); --shadow:0 20px 60px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{overflow-x:hidden}
body{margin:0; min-height:100vh; display:flex; flex-direction:column; overflow-x:hidden; background:var(--bg); color:var(--fg); font-family:var(--f-ui); font-size:14px; line-height:1.45}
body > main{flex:1 0 auto; width:100%}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--surface)}
button,input,select,textarea{font:inherit; color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
.mono{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
/* full window width: 16 px gutter, 24 px on screens wider than 1400 px */
.wrap{width:100%; max-width:none; margin:0; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}
@media (min-width:1401px){ .wrap{padding-left:max(24px, env(safe-area-inset-left,0px)); padding-right:max(24px, env(safe-area-inset-right,0px))} }

/* top bar */
.topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--surface); border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex; flex-wrap:wrap; align-items:center; gap:10px 18px; padding-block:10px}
.brand{display:flex; align-items:center; gap:10px; font-family:var(--f-cond); font-weight:700; font-size:18px; letter-spacing:.01em}
.brand svg{color:var(--accent)}
.tabs{display:flex; gap:4px; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:3px}
.tab{border:0; background:transparent; padding:8px 14px; border-radius:8px; cursor:pointer; color:var(--muted); font-weight:500; min-height:38px}
.tab[aria-selected="true"]{background:var(--surface); color:var(--fg); box-shadow:0 1px 2px rgba(0,0,0,.08), inset 0 0 0 1px var(--line)}
.spacer{flex:1 1 auto}
.sim{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.sim .clock{font-family:var(--f-mono); font-size:15px; padding:6px 10px; border:1px solid var(--line); border-radius:8px; background:var(--surface-2); min-width:92px; text-align:center}
.iconbtn{display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:38px; min-width:38px; padding:0 10px; border-radius:8px; border:1px solid var(--line); background:var(--surface); cursor:pointer; color:var(--fg); transition:background .15s, border-color .15s, transform .1s}
.iconbtn:hover{background:var(--surface-2); border-color:var(--faint)}
.iconbtn:active{transform:scale(.97)}
.iconbtn[aria-pressed="true"]{background:var(--accent-weak); border-color:var(--accent); color:var(--accent)}
.badge-sample{font-size:12px; padding:4px 10px; border-radius:999px; border:1px dashed var(--faint); color:var(--muted)}

main{padding-block:20px 48px; display:flex; flex-direction:column; gap:16px}
.view{display:flex; flex-direction:column; gap:16px}
.view[hidden]{display:none}

/* summary strip */
.kpis{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:10px}
.kpi{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px; display:flex; flex-direction:column; gap:2px; text-align:left; cursor:pointer; transition:border-color .15s, transform .15s}
.kpi:hover{border-color:var(--accent); transform:translateY(-1px)}
.kpi .k-label{font-family:var(--f-cond); font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:600}
.kpi .k-value{font-family:var(--f-cond); font-size:28px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.1}
.kpi .k-sub{font-size:12px; color:var(--muted)}
.kpi[data-tone="warn"] .k-value{color:var(--warn)}
.kpi[data-tone="crit"] .k-value{color:var(--crit)}

/* panels */
.panel{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:12px; min-width:0}
.panel-h{display:flex; align-items:center; gap:10px 12px; flex-wrap:wrap}
.panel-h h2{margin:0; font-family:var(--f-cond); font-size:17px; font-weight:600; letter-spacing:.01em; text-wrap:balance}
.panel-h .hint{color:var(--muted); font-size:13px}
.grid-2{display:grid; grid-template-columns:minmax(0,1.7fr) minmax(0,1fr); gap:16px; align-items:start}
.stack{display:flex; flex-direction:column; gap:16px; min-width:0}
@media (max-width:1000px){ .grid-2{grid-template-columns:minmax(0,1fr)} }

/* chips and pills */
.pill{display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:600; white-space:nowrap; background:var(--surface-2); color:var(--muted); border:1px solid var(--line)}
.pill[data-tone="ok"]{background:var(--good-weak); color:var(--good); border-color:transparent}
.pill[data-tone="warn"]{background:var(--warn-weak); color:var(--warn); border-color:transparent}
.pill[data-tone="crit"]{background:var(--crit-weak); color:var(--crit); border-color:transparent}
.pill[data-tone="info"]{background:var(--accent-weak); color:var(--accent); border-color:transparent}
.pill .dot{width:7px; height:7px; border-radius:999px; background:currentColor}
.pill[data-pulse] .dot{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1; transform:scale(1)}50%{opacity:.35; transform:scale(.7)}}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:40px; padding:0 14px; border-radius:9px; border:1px solid var(--line); background:var(--surface); cursor:pointer; font-weight:500; transition:background .15s, border-color .15s, transform .1s}
.btn:hover{background:var(--surface-2); border-color:var(--faint)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent); color:var(--accent-fg); border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--crit); border-color:var(--crit)}
.btn[disabled]{opacity:.55; cursor:not-allowed}
.btn.sm{min-height:34px; padding:0 10px; font-size:13px}
.seg{display:flex; gap:6px; flex-wrap:wrap}
.seg button{min-height:34px; padding:0 12px; border-radius:999px; border:1px solid var(--line); background:transparent; cursor:pointer; color:var(--muted); font-size:13px; font-weight:500}
.seg button[aria-pressed="true"]{background:var(--fg); color:var(--bg); border-color:var(--fg)}

/* bars */
.track{position:relative; height:8px; border-radius:999px; background:var(--track); overflow:hidden; min-width:40px}
.track i{position:absolute; inset:0 auto 0 0; border-radius:999px; background:var(--accent); transition:width .9s cubic-bezier(.2,.7,.2,1), background .3s}
.track i[data-tone="warn"]{background:var(--warn)}
.track i[data-tone="crit"]{background:var(--crit)}
.track b{position:absolute; top:-2px; bottom:-2px; width:1px; background:var(--faint); opacity:.8}
.meter{display:grid; grid-template-columns:40px minmax(0,1fr) auto; gap:10px; align-items:center; font-size:12px}
.meter .m-label{color:var(--muted)}
.meter .m-val{font-family:var(--f-mono); min-width:86px; text-align:right}

/* alerts */
.alerts{display:flex; flex-direction:column; gap:8px}
.alert{display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 14px; animation:slideIn .45s ease both}
.alert .a-title{font-weight:600}
.alert .a-detail{color:var(--muted); font-size:13px}
@keyframes slideIn{from{opacity:0; transform:translateY(-6px)}to{opacity:1; transform:none}}

/* nodes */
.nodes{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:12px}
.node{text-align:left; border:1px solid var(--line); border-radius:12px; padding:14px; background:var(--surface-2); display:flex; flex-direction:column; gap:10px; cursor:pointer; transition:border-color .15s, box-shadow .2s, transform .15s; width:100%}
.node:hover{border-color:var(--accent); box-shadow:0 6px 18px rgba(16,24,40,.10); transform:translateY(-1px)}
.node-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.node-top .n-name{font-family:var(--f-cond); font-weight:700; font-size:17px}
.slots{display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:12px; color:var(--muted)}
.slot{width:16px; height:16px; border-radius:4px; border:1px solid var(--faint); transition:background .4s, border-color .4s}
.slot[data-used]{background:var(--accent); border-color:var(--accent)}
.node-accs{display:flex; flex-direction:column; gap:5px; border-top:1px solid var(--line-soft); padding-top:9px}
.node-acc{display:flex; align-items:center; gap:8px; font-size:12px; min-width:0}
.node-acc .who{font-family:var(--f-mono)}
.node-acc .what{color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.sdot{width:8px; height:8px; border-radius:999px; background:var(--faint); flex:none}
.sdot[data-tone="ok"]{background:var(--good)} .sdot[data-tone="warn"]{background:var(--warn)} .sdot[data-tone="crit"]{background:var(--crit)} .sdot[data-tone="info"]{background:var(--accent)}

/* feed */
.feed{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; max-height:470px; overflow:auto; scrollbar-width:thin}
.feed li{display:grid; grid-template-columns:62px 118px minmax(0,1fr); gap:8px; align-items:baseline; padding:7px 2px; border-bottom:1px solid var(--line-soft); font-size:12.5px}
.feed li.enter{animation:feedIn .6s cubic-bezier(.2,.7,.2,1) both}
.feed li.enter .f-text{animation:flash 1.6s ease both}
@keyframes feedIn{from{opacity:0; transform:translateY(-8px)}to{opacity:1; transform:none}}
@keyframes flash{from{background:var(--accent-weak)}to{background:transparent}}
.feed .f-time{font-family:var(--f-mono); color:var(--muted)}
.feed .f-type{font-family:var(--f-mono); font-size:11px; padding:1px 6px; border-radius:6px; background:var(--surface-2); border:1px solid var(--line); justify-self:start; color:var(--muted)}
.feed .f-type[data-tone="ok"]{color:var(--good)} .feed .f-type[data-tone="warn"]{color:var(--warn)} .feed .f-type[data-tone="crit"]{color:var(--crit)} .feed .f-type[data-tone="info"]{color:var(--accent)}
.feed .f-text{min-width:0; overflow-wrap:anywhere; border-radius:4px}

/* tables */
.tablebox{overflow-x:auto}
table{width:100%; border-collapse:collapse; min-width:860px}
th{font-family:var(--f-cond); font-weight:600; font-size:12px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); text-align:left; padding:8px 10px; border-bottom:1px solid var(--line)}
td{padding:10px; border-bottom:1px solid var(--line-soft); vertical-align:middle}
tbody tr{cursor:pointer; transition:background .15s}
tbody tr:hover{background:var(--surface-2)}
tbody tr:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}

/* services */
.svc{display:grid; grid-template-columns:10px minmax(0,1fr) auto auto; gap:10px; align-items:center; padding:7px 4px; border-bottom:1px solid var(--line-soft); font-size:12.5px; background:none; border-left:0; border-right:0; border-top:0; width:100%; text-align:left; cursor:pointer; border-radius:6px}
.svc:hover{background:var(--surface-2)}
.svc .s-group{color:var(--muted)}
.svc .s-mem{font-family:var(--f-mono); min-width:62px; text-align:right}

/* incidents and rollout */
.inc{border:1px solid var(--line); border-radius:10px; padding:11px 13px; display:flex; flex-direction:column; gap:5px; background:var(--surface-2); text-align:left; cursor:pointer; width:100%; transition:border-color .15s}
.inc:hover{border-color:var(--accent)}
.inc-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.roll{display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--line-soft); flex-wrap:wrap; font-size:13px}

/* delivery */
.dhead{display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap}
.projtabs{display:flex; gap:6px; flex-wrap:wrap}
.projtab{min-height:40px; padding:0 14px; border-radius:10px; border:1px solid var(--line); background:var(--surface); cursor:pointer; display:flex; align-items:center; gap:8px; font-weight:600}
.projtab[aria-pressed="true"]{border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent)}
.projtab .sub{font-weight:400; font-size:12px; color:var(--muted)}
.search{display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:10px; padding:0 10px; background:var(--surface); min-height:40px; flex:1 1 220px; max-width:360px}
.search input{border:0; outline:0; background:transparent; min-width:0; flex:1; min-height:38px}
.search:focus-within{border-color:var(--accent)}
.board{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(232px,1fr); gap:10px; overflow-x:auto; padding-bottom:6px; scrollbar-width:thin}
.col{background:var(--surface-2); border:1px solid var(--line-soft); border-radius:12px; padding:10px; display:flex; flex-direction:column; gap:8px; min-height:160px}
.col-h{display:flex; align-items:center; justify-content:space-between; font-family:var(--f-cond); font-weight:600; font-size:13px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted)}
.col-h .count{font-family:var(--f-mono); font-size:12px; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:0 8px; color:var(--fg)}
.col-empty{font-size:12px; color:var(--faint); text-align:center; padding:14px 0}
.card{display:flex; flex-direction:column; gap:7px; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 11px; cursor:pointer; width:100%; transition:border-color .15s, box-shadow .2s, transform .15s}
.card:hover{border-color:var(--accent); box-shadow:0 6px 18px rgba(16,24,40,.10); transform:translateY(-1px)}
.card .c-top{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.card .c-key{font-family:var(--f-mono); font-size:12px; color:var(--muted)}
.card .c-type{font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:5px; padding:0 5px}
.card .c-title{font-weight:500; font-size:13.5px; line-height:1.35}
.card .c-run{font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.card .c-clock{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; align-items:center; font-size:12px}
.flag{font-size:11px; font-weight:600; padding:1px 7px; border-radius:999px}
.flag[data-tone="warn"]{background:var(--warn-weak); color:var(--warn)}
.flag[data-tone="crit"]{background:var(--crit-weak); color:var(--crit)}
.flag[data-tone="info"]{background:var(--accent-weak); color:var(--accent)}
.flag[data-tone="ok"]{background:var(--good-weak); color:var(--good)}
.flag[data-tone="muted"]{background:var(--surface-2); color:var(--muted); border:1px solid var(--line)}
.att{display:flex; flex-direction:column; gap:8px}
.att-item{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:10px; align-items:center; border:1px solid var(--line); border-radius:10px; padding:10px 12px; background:var(--surface-2); text-align:left; cursor:pointer; width:100%}
.att-item:hover{border-color:var(--accent)}
.att-item .t{font-weight:500}
.att-item .d{color:var(--muted); font-size:12.5px}
.bd{display:flex; flex-direction:column; gap:8px}
.bd-row{display:grid; grid-template-columns:96px minmax(0,1fr) 64px; gap:10px; align-items:center; font-size:12.5px}
.bd-bar{display:flex; height:16px; border-radius:6px; overflow:hidden; background:var(--track)}
.bd-bar span{height:100%; transition:width .9s cubic-bezier(.2,.7,.2,1); position:relative}
.bd-bar span:hover{filter:brightness(1.12)}
.seg-work{background:var(--accent)} .seg-ci{background:var(--faint)} .seg-queue{background:var(--warn)} .seg-blocked{background:var(--crit)}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--muted)}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend i{width:10px; height:10px; border-radius:3px; display:inline-block}
.uat-line{display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:13px}
.progress{height:6px; border-radius:999px; background:var(--track); overflow:hidden}
.progress i{display:block; height:100%; background:var(--accent); width:0; transition:width .4s linear}

/* drawer and modal */
.overlay{position:fixed; inset:0; background:var(--overlay); z-index:40; opacity:0; pointer-events:none; transition:opacity .25s}
.overlay[data-open]{opacity:1; pointer-events:auto}
.drawer{position:fixed; top:0; right:0; bottom:0; width:min(560px,100vw); z-index:41; background:var(--surface); border-left:1px solid var(--line); box-shadow:var(--shadow); transform:translateX(102%); transition:transform .32s cubic-bezier(.2,.7,.2,1); display:flex; flex-direction:column; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); padding-right:env(safe-area-inset-right,0px)}
.drawer[data-open]{transform:none}
.drawer-h{display:flex; align-items:flex-start; gap:10px; padding:16px 18px 12px; border-bottom:1px solid var(--line)}
.drawer-h .d-title{flex:1; min-width:0}
.drawer-h h3{margin:2px 0 0; font-family:var(--f-cond); font-size:20px; font-weight:600; text-wrap:balance}
.drawer-b{padding:16px 18px 28px; overflow:auto; display:flex; flex-direction:column; gap:18px}
.report-md{margin:0; padding:12px; border:1px solid var(--line); border-radius:9px; background:var(--surface-2); white-space:pre-wrap; overflow-wrap:anywhere; font:12px/1.55 var(--f-mono); color:var(--text)}
.dsec{display:flex; flex-direction:column; gap:8px}
.dsec h4{margin:0; font-family:var(--f-cond); font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:600}
.facts{display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:10px}
.fact{display:flex; flex-direction:column; gap:1px; background:var(--surface-2); border:1px solid var(--line-soft); border-radius:9px; padding:8px 10px; min-width:0}
.fact .fl{font-size:11.5px; color:var(--muted)}
.fact .fv{font-weight:600; overflow-wrap:anywhere}
.checklist{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px}
.checklist li{display:grid; grid-template-columns:20px minmax(0,1fr); gap:8px; align-items:start; font-size:13px}
.ico-ok{color:var(--good)} .ico-fail{color:var(--crit)} .ico-pend{color:var(--faint)} .ico-run{color:var(--accent)}

label{font-size:13px; font-weight:500; display:flex; flex-direction:column; gap:6px}

/* toasts */
.toasts{position:fixed; z-index:50; right:max(16px, env(safe-area-inset-right,0px)); bottom:calc(16px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:8px; width:min(360px, calc(100vw - 32px))}

@keyframes toastIn{from{opacity:0; transform:translateY(10px) scale(.98)}to{opacity:1; transform:none}}
@keyframes toastOut{to{opacity:0; transform:translateX(20px)}}

.flash-target{animation:ring 1.4s ease}
@keyframes ring{0%{box-shadow:0 0 0 0 var(--accent-weak)}30%{box-shadow:0 0 0 6px var(--accent-weak)}100%{box-shadow:0 0 0 0 transparent}}
::view-transition-old(root),::view-transition-new(root){animation-duration:.25s}

}

  *,*::before,*::after{animation:none !important; transition:none !important}
}

<script>
(function () {
'use strict';
/* AI Flow v4 console: Command Center and Delivery, rendered from the live registry (/v1/state every 5 s,
   /v1/services every 15 s, /v1/tickets/<key> for the ticket drawer). No sample data: what you see is what the
   control plane knows. */

var POLL_MS = 5000, SVC_MS = 15000, STALE_S = 20, ANALYTICS_MS = 60000, ANALYTICS_DAYS = 14;
var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function $(s, r) { return (r || document).querySelector(s); }
function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function pad(n) { return String(n).padStart(2, '0'); }
function mmss(sec) { if (sec == null) return '—'; sec = Math.max(0, Math.floor(sec)); var h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return h ? h + ':' + pad(m) + ':' + pad(s) : m + ':' + pad(s); }
function ago(sec) { if (sec == null) return 'never'; sec = Math.max(0, Math.round(sec)); if (sec < 60) return sec + ' s ago'; if (sec < 3600) return Math.floor(sec / 60) + ' min ago'; if (sec < 86400) return Math.floor(sec / 3600) + ' h ' + Math.floor(sec % 3600 / 60) + ' min ago'; return Math.floor(sec / 86400) + ' d ago'; }
function nodeLastSeen(n) {
  if (!n.last_heartbeat) return 'never';
  var age = (n.heartbeat_age_s || 0) + since();
  var seen = when(n.last_heartbeat) + ' (' + ago(age) + ')';
  return n.status === 'offline' ? 'last seen ' + seen : seen;
}
function tok(n) { n = Number(n || 0); return n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'k' : String(Math.round(n)); }
function gib(b) { return b == null ? '—' : (b / 1073741824).toFixed(1) + ' GiB'; }
function usd(v) { v = Number(v || 0); return v ? '$' + v.toFixed(v < 1 ? 3 : 2) : '—'; }
function tone(p) { return p >= 90 ? 'crit' : p >= 75 ? 'warn' : 'ok'; }
function hhmm(iso) { if (!iso) return '—'; var d = new Date(iso); return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); }
function when(iso) { if (!iso) return '—'; var d = new Date(iso); var today = new Date(); var same = d.toDateString() === today.toDateString(); return (same ? '' : (d.getMonth() + 1) + '/' + d.getDate() + ' ') + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function epochWhen(sec) { return sec ? when(new Date(sec * 1000).toISOString()) : '—'; }

var ICON = {
  close: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>',
  ok: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5 10 17l9-10"></path></svg>',
  fail: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"></path></svg>',
  pend: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="7"></circle></svg>',
  search: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m20 20-4-4"></path></svg>',
  ext: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path></svg>',
  info: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7.5v.01"></path></svg>',
  warn: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4 2.8 19.5h18.4z"></path><path d="M12 10v4.5M12 17.2v.01"></path></svg>',
  theme: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"></path></svg>'
};

/* ---------- state ---------- */
var S = {
  data: null, fetchedAt: 0, lastOk: 0, error: '', services: [], svcError: '', analytics: [], anError: '',
  view: location.pathname.indexOf('/delivery') === 0 ? 'delivery' : 'cc',
  project: null, search: '', typeFilter: 'all', epic: 'all', accFilter: 'all',
  seenInc: null, seenRuns: null, drawer: null, ticket: {}, first: true
};
var STATUS_COLS = [['Backlog', 'Backlog'], ['Intake', 'Intake'], ['To Do', 'To Do'], ['In Progress', 'In Progress'], ['In Verify', 'In Verify'], ['Human review', 'Human review'], ['Needs owner', 'Needs owner'], ['Done', 'Done']];
var KIND = { node_down: 'Node down', node_no_ai: 'Empty node', ticket_stuck: 'Stuck ticket', role_coverage: 'Role coverage', account_quota: 'Account', quota_high: 'Quota', run_slow: 'Slow run', run_hard_limit: 'Run limit' };
var PROVIDER = { claude: 'Claude', codex: 'Codex', grok: 'Grok', opencode: 'OpenCode' };

function D() { return S.data || { nodes: [], accounts: [], active_runs: [], recent_runs: [], projects: [], tickets: [], incidents: [], events: [], totals: {}, versions: {} }; }
function since() { return (Date.now() - S.fetchedAt) / 1000; }
function nodeBy(n) { return D().nodes.filter(function (x) { return x.name === n; })[0]; }
function accBy(id) { return D().accounts.filter(function (x) { return x.id === id; })[0]; }
function ticketBy(k) { return D().tickets.filter(function (x) { return x.key === k; })[0]; }
function incBy(id) { return D().incidents.concat(D().incidents_recent || []).filter(function (x) { return String(x.id) === String(id); })[0]; }

function nodeTone(n) { return { online: 'ok', offline: 'crit', draining: 'warn', joined: 'info' }[n.status] || 'muted'; }
function nodeLabel(n) { return { online: 'Online', offline: 'Offline', draining: 'Draining', joined: 'Joining' }[n.status] || n.status; }
function accTone(a) { return { working: 'info', probing: 'info', idle: 'ok', cooldown: 'warn', signed_out: 'crit', error: 'crit', stopped: 'muted', unknown: 'muted', node_offline: 'crit' }[a.status] || 'muted'; }
function accLabel(a) { return { working: 'Working', probing: 'Checking', idle: 'Ready', cooldown: 'No quota', signed_out: 'Signed out', error: 'Failing', stopped: 'Stopped', unknown: 'No worker', node_offline: 'Node offline' }[a.status] || a.status; }
function doing(a) {
  if (a.run) return a.run.ticket + ' · ' + a.run.step + ' · ' + mmss((a.run.elapsed_s || 0) + since());
  if (a.status === 'cooldown') return 'paused until ' + (a.cooldown_until ? when(a.cooldown_until) : 'reset') + (a.last_error ? ' · ' + a.last_error : '');
  if (a.status === 'signed_out') return 'needs sign-in on its node · ' + (a.last_error || '');
  if (a.status === 'error') return a.last_error || 'last check failed';
  if (a.status === 'unknown') return 'no worker reported yet';
  if (a.status === 'stopped') return 'worker stopped';
  if (a.status === 'node_offline') return 'its node ' + a.node + ' is offline';
  return 'waiting for a ready ticket';
}
function runTone(o) { return { done: 'ok', PASS: 'ok', DONE: 'ok', merged: 'ok', human: 'info', rework: 'warn', blocked: 'warn', quota: 'warn', failed: 'crit', timeout: 'crit', lost: 'crit', released: 'muted', running: 'info' }[o] || 'muted'; }
function stTone(s) { return { 'Done': 'ok', 'In Progress': 'info', 'In Verify': 'info', 'Human review': 'info', 'Needs owner': 'crit', 'Intake': 'warn' }[s] || 'muted'; }

/* ---------- fetch ---------- */
function poll() {
  fetch('/v1/state', { cache: 'no-store' }).then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function (d) {
    var prevInc = S.seenInc, prevRuns = S.seenRuns;
    S.data = d; S.fetchedAt = Date.now(); S.lastOk = Date.now(); S.error = '';
    if (!S.project && d.projects.length) S.project = d.projects[0].key;
    notify(prevInc, prevRuns);
    render();
  }).catch(function (e) { S.error = String(e.message || e); renderLive(); })
    .then(function () { setTimeout(poll, POLL_MS); });
}
function pollServices() {
  fetch('/v1/services', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (d) {
    S.services = d.services || []; S.svcError = d.error || '';
    if (S.view === 'cc' && S.data) renderCC();
  }).catch(function (e) { S.svcError = String(e.message || e); })
    .then(function () { setTimeout(pollServices, SVC_MS); });
}
function pollAnalytics() {
  fetch('/v1/analytics/daily?days=' + ANALYTICS_DAYS, { cache: 'no-store' }).then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function (d) {
    S.analytics = d.rows || []; S.anError = '';
    if (S.view === 'delivery' && S.data) renderDBody();
  }).catch(function (e) { S.anError = String(e.message || e); })
    .then(function () { setTimeout(pollAnalytics, ANALYTICS_MS); });
}
function notify(prevInc, prevRuns) {
  var d = D();
  var inc = {}; d.incidents.forEach(function (i) { inc[i.id] = i; });
  var runs = {}; d.recent_runs.forEach(function (r) { runs[r.id] = r; });
  if (prevInc) {
    d.incidents.forEach(function (i) { if (!prevInc[i.id]) toast(i.title, i.detail, i.severity === 'critical' ? 'crit' : 'warn'); });
    Object.keys(prevInc).forEach(function (id) { if (!inc[id]) toast('Resolved: ' + prevInc[id].title, '', 'ok'); });
  }
  if (prevRuns) {

  var pr = (a.worker && a.worker.probe) || {};
  var b = '<div class="facts">' + fact('Provider', esc(PROVIDER[a.provider] || a.provider)) + fact('Tier', esc(a.tier)) + fact('Node', '<span class="mono">' + esc(a.node) + '</span>') + fact('Model', '<span class="mono">' + esc(a.model || '—') + '</span>') + fact('Roles', esc((a.roles || []).join(', ') || '—')) + fact('Takes tickets', a.explicit_only ? 'only when a ticket asks for ' + esc(a.provider) : 'any ready ticket') + '</div>';
  b += '<div class="dsec"><h4>Quota</h4>' + qwin(a) + (a.cooldown ? '<div class="small">Cooling down (' + esc(a.cooldown.reason) + '), ' + mmss(a.cooldown.seconds_left) + ' left.</div>' : '') + (a.provider === 'claude' ? '<div class="small">At 90% of a window the watchdog opens a warning; at 100% the account pauses until the reset time and other accounts take its tickets. A Claude limit reset offer (Settings > Usage) restores it at once.</div>' : '') + '</div>';
  b += '<div class="dsec"><h4>Last check</h4><div style="font-size:13px">' + (pr.at ? (pr.ok ? 'Passed ' : 'Failed ') + when(new Date(pr.at * 1000).toISOString()) + (pr.error_kind ? ' · ' + esc(pr.error_kind) : '') + (pr.next ? ' · next ' + when(new Date(pr.next * 1000).toISOString()) : '') : 'Not checked yet') + '</div>' + (a.last_error ? '<div class="small" style="color:var(--crit)">' + esc(a.last_error) + '</div>' : '') + '</div>';
  b += '<div class="dsec"><h4>Now</h4><div style="font-size:13px">' + esc(doing(a)) + '</div></div>';
  var runs = D().recent_runs.filter(function (r) { return r.account === a.id; });
  b += '<div class="dsec"><h4>Recent runs</h4>' + runsTable(runs, 10) + '</div>';
  b += '<div class="dsec"><h4>Config directory</h4><div class="codeline"><code>/srv/aiflow/accounts/' + esc(a.id) + '</code></div></div>';
  return drawerShell('account · ' + esc(PROVIDER[a.provider] || a.provider), esc(a.id), pill(accTone(a), accLabel(a)), b);
}
function drawerInc(id) {
  var i = incBy(id); if (!i) return drawerShell('incident', '#' + esc(id), '', '<div class="empty">Closed and no longer listed.</div>');
  var b = '<div style="font-size:13.5px">' + esc(i.detail) + '</div><div class="facts">' + fact('Kind', esc(KIND[i.kind] || i.kind)) + fact('Subject', '<span class="mono">' + esc(i.subject) + '</span>') + fact('Opened', when(i.opened_at)) + fact('Closed', i.closed_at ? when(i.closed_at) : 'open') + '</div>';
  b += '<div class="dsec"><h4>What happens</h4><div style="font-size:13px">' + ({
    node_down: 'Runs on the node keep their lease for 90 s; then the watchdog marks them lost and moves their tickets back to To Do with a comment. The incident closes on the next heartbeat.',
    account_quota: 'The account takes no ticket until it passes its next check; its tickets go to the other accounts.',
    quota_high: 'Informational until 100%; then the account pauses until the reset time.',
    run_slow: 'The run passed the warning clock. It keeps working until the hard limit.',
    role_coverage: 'A role the flow needs (master, intake, verify, dev) has fewer than two ready accounts, so one quota limit or outage could stop it. Sign in or add an account with that role, ideally from another provider.',
    node_no_ai: 'The node heartbeats and adds slots, but no AI account is assigned to it, so no worker runs there. Assign accounts in aiflow-control/accounts.yaml and sign them in on the node.',
    ticket_stuck: 'Dev runs of this ticket keep failing. Retries wait longer each time (up to 30 minutes). Read the last run in the ticket drawer, fix the cause or put the ticket on hold.',
    run_hard_limit: 'The run passed the hard limit; the worker stops it and the ticket goes back to To Do.'
  }[i.kind] || 'Handled by the watchdog.') + '</div></div>';
  return drawerShell('incident #' + esc(i.id), esc(i.title), pill(i.closed_at ? 'ok' : i.severity === 'critical' ? 'crit' : 'warn', i.closed_at ? 'Resolved' : i.severity), b);
}
function drawerReport() {
  var r = S.drawer, label = r.epic ? esc(r.epic) : esc(r.id);
  if (r.error) return drawerShell('project report', label, '', '<div class="empty">' + esc(r.error) + '</div>');
  if (!r.text) return drawerShell('project report', label, '', '<div class="empty">Loading Markdown report…</div>');
  var b = '<div style="display:flex;justify-content:flex-end"><button class="btn sm" data-act="copy-report">Copy Markdown</button></div>' +
    '<pre class="report-md">' + esc(r.text) + '</pre>';
  return drawerShell('project report', label, '', b);
}
function renderDrawer() {
  var d = $('#drawer'); if (!S.drawer) return;
  var k = S.drawer.kind, id = S.drawer.id, html = '';
  if (k === 'ticket') html = drawerTicket(id);
  if (k === 'node') html = drawerNode(id);
  if (k === 'acc') html = drawerAcc(id);
  if (k === 'inc') html = drawerInc(id);
  if (k === 'report') html = drawerReport();
  var body = $('.drawer-b', d), scroll = body ? body.scrollTop : 0;
  d.innerHTML = html;
  var nb = $('.drawer-b', d); if (nb) nb.scrollTop = scroll;
  tick();
}
function loadTicket(key) {
  fetch('/v1/tickets/' + encodeURIComponent(key), { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
    if (d) { S.ticket[key] = d; if (S.drawer && S.drawer.kind === 'ticket' && S.drawer.id === key) renderDrawer(); }
  }).catch(function () {});
}
function loadProjectReport(project, epic) {
  var query = 'format=md' + (epic ? '&epic=' + encodeURIComponent(epic) : '');
  fetch('/v1/projects/' + encodeURIComponent(project) + '/report?' + query, { cache: 'no-store' }).then(function (r) {
    if (!r.ok) throw new Error('Report could not be loaded (' + r.status + ')');
    return r.text();
  }).then(function (text) {
    if (S.drawer && S.drawer.kind === 'report' && S.drawer.id === project && S.drawer.epic === epic) {
      S.drawer.text = text; renderDrawer();
    }
  }).catch(function (e) {
    if (S.drawer && S.drawer.kind === 'report' && S.drawer.id === project && S.drawer.epic === epic) {
      S.drawer.error = String(e.message || e); renderDrawer();
    }
  });
}
function openProjectReport(opener) {
  lastFocus = opener || document.activeElement;
  var epic = S.epic === 'all' ? null : S.epic;
  S.drawer = { kind: 'report', id: S.project, epic: epic, text: '', error: '' };
  renderDrawer();
  $('#overlay').setAttribute('data-open', ''); $('#drawer').setAttribute('data-open', ''); $('#drawer').setAttribute('aria-hidden', 'false');
  loadProjectReport(S.project, epic);
  setTimeout(function () { var c = $('#drawer [data-act="close"]'); if (c) c.focus(); }, 60);
}
function copyReport() {
  var text = S.drawer && S.drawer.text || '';
  function copied(ok) { toast(ok ? 'Report copied' : 'Could not copy report', ok ? 'Markdown copied to clipboard' : 'Select and copy the report text', ok ? 'ok' : 'warn'); }
  if (window.navigator && window.navigator.clipboard && window.navigator.clipboard.writeText) {
    window.navigator.clipboard.writeText(text).then(function () { copied(true); }).catch(function () { copied(false); });
    return;
  }
  var field = document.createElement('textarea'); field.value = text;
  field.setAttribute('readonly', ''); field.style.position = 'fixed'; field.style.opacity = '0';
  document.body.appendChild(field); field.select();
  var ok = document.execCommand && document.execCommand('copy');
  field.remove(); copied(Boolean(ok));
}
var lastFocus = null;
function openDrawer(kind, id, opener) {
  lastFocus = opener || document.activeElement;
  S.drawer = { kind: kind, id: id };
  if (kind === 'ticket') loadTicket(id);
  renderDrawer();
  $('#overlay').setAttribute('data-open', ''); $('#drawer').setAttribute('data-open', ''); $('#drawer').setAttribute('aria-hidden', 'false');
  setTimeout(function () { var c = $('#drawer [data-act="close"]'); if (c) c.focus(); }, 60);
}
function closeAll() {
  S.drawer = null;
  $('#overlay').removeAttribute('data-open'); $('#drawer').removeAttribute('data-open'); $('#drawer').setAttribute('aria-hidden', 'true');
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}

/* ---------- render and live tick ---------- */
/* ---------- footer ---------- */
function footerVersion(d) { return ((d.versions || {}).ai_flow || {}).ref || d.version || '—'; }
function renderFooter() {
  var d = D(), links = d.links || {};
  $('#f-year').textContent = String(new Date().getFullYear());
  if (!S.data) return;
  $('#f-version').textContent = footerVersion(d);
  $('#f-env').textContent = d.env || '—';
  $('#f-control').textContent = String(d.control_repo || '—').replace('ref: refs/heads/', '');
  [['#f-o2', links.o2], ['#f-mail', links.mail], ['#f-gatus', links.gatus]].forEach(function (l) { if (l[1]) $(l[0]).setAttribute('href', l[1]); });
}

function render() {
  renderLive();
  renderFooter();
  if (S.view === 'cc') renderCC(); else { renderDHead(); renderDBody(); }
  if (S.drawer) { if (S.drawer.kind === 'ticket' && S.data) loadTicket(S.drawer.id); renderDrawer(); }
  tick();
}
function tick() {
  var s = since();
  $$('[data-since]').forEach(function (el) {
    var v = el.getAttribute('data-since'); if (v === '') { el.textContent = 'never'; return; }
    var sec = Number(v) + s;
    el.textContent = el.getAttribute('data-fmt') === 'ago' ? ago(sec) : mmss(sec);
  });
  $$('[data-clock]').forEach(function (el) {
    var sec = Number(el.getAttribute('data-clock')) + s, hard = Number(el.getAttribute('data-hard')) || 3600, p = Math.min(100, 100 * sec / hard);
    el.style.width = p.toFixed(1) + '%'; el.setAttribute('data-tone', p >= 75 ? 'crit' : p >= 50 ? 'warn' : 'ok');
  });
  renderLive();
}
function setView(v) {
  if (S.view === v) return;
  S.view = v;
  $$('.tab').forEach(function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-view') === v)); });
  $('#view-cc').hidden = v !== 'cc'; $('#view-delivery').hidden = v !== 'delivery';
  try { history.pushState(null, '', v === 'cc' ? '/cc' : '/delivery'); } catch (e) { /* file preview */ }
  render();
}
function flash(id) { var el = document.getElementById(id); if (!el) return; el.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' }); el.classList.remove('flash-target'); void el.offsetWidth; el.classList.add('flash-target'); }

/* ---------- interactions ---------- */
document.addEventListener('click', function (e) {
  if (e.target.closest('[data-stop]')) return;
  var el = e.target.closest('[data-act]');
  if (!el) { if (e.target.id === 'overlay') closeAll(); return; }
  var act = el.getAttribute('data-act');
  if (act === 'view') setView(el.getAttribute('data-view'));
  else if (act === 'jump') flash(el.getAttribute('data-target'));
  else if (act === 'open-node') openDrawer('node', el.getAttribute('data-id'), el);
  else if (act === 'open-acc') openDrawer('acc', el.getAttribute('data-id'), el);
  else if (act === 'open-inc') openDrawer('inc', el.getAttribute('data-id'), el);
  else if (act === 'open-ticket') openDrawer('ticket', el.getAttribute('data-key'), el);
  else if (act === 'open-report') openProjectReport(el);
  else if (act === 'copy-report') copyReport();
  else if (act === 'close') closeAll();
  else if (act === 'accfilter') { S.accFilter = el.getAttribute('data-f'); renderCC(); }
  else if (act === 'project') { S.project = el.getAttribute('data-p'); S.epic = 'all'; render(); }
  else if (act === 'type') { S.typeFilter = el.getAttribute('data-t'); renderDHead(); renderDBody(); tick(); }
  else if (act === 'epic') { S.epic = el.getAttribute('data-key'); renderDHead(); renderDBody(); tick(); flash('d-board'); }
  else if (act === 'theme') {
    var cur = document.documentElement.getAttribute('data-theme');
    var dark = cur ? cur === 'dark' : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
    try { localStorage.setItem('aiflow4-theme', dark ? 'light' : 'dark'); } catch (x) { /* storage off */ }
  }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && S.drawer) closeAll();
  if (e.key === 'Enter' && e.target.matches && e.target.matches('tr[data-act]')) e.target.click();
});
document.addEventListener('input', function (e) {
  if (e.target.id === 'q') { S.search = e.target.value; renderDBody(); tick(); }
});
document.addEventListener('change', function (e) {
  if (e.target.id === 'epicSel') { S.epic = e.target.value; renderDBody(); tick(); }
});
window.addEventListener('popstate', function () { setView(location.pathname.indexOf('/delivery') === 0 ? 'delivery' : 'cc'); });

/* ---------- boot ---------- */
try { var th = localStorage.getItem('aiflow4-theme'); if (th) document.documentElement.setAttribute('data-theme', th); } catch (x) { /* storage off */ }
$$('.tab').forEach(function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-view') === S.view)); });
$('#view-cc').hidden = S.view !== 'cc'; $('#view-delivery').hidden = S.view !== 'delivery';
render();
poll(); pollServices(); pollAnalytics();
setInterval(tick, 1000);
})();
</script>
